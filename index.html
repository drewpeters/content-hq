<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F2A28'/%3E%3Crect x='16' y='22' width='16' height='56' rx='3' fill='%23B8742E'/%3E%3Crect x='42' y='22' width='16' height='56' rx='3' fill='%232F6B5B'/%3E%3Crect x='68' y='22' width='16' height='56' rx='3' fill='%23D9DED6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEEA;--surface:#FFFFFF;--surface2:#F5F7F4;--line:#D9DED6;--line2:#C7CEC4;
  --ink:#1C2422;--ink2:#4B5752;--ink3:#76827C;
  --side:#1F2A28;--side2:#2A3734;--sideInk:#DCE3DE;--sideInk2:#95A39D;
  --cedar:#B8742E;--cedarD:#9A5F22;--cedarL:#F3E4D2;
  --green:#2F6B5B;--greenD:#245446;--greenL:#DCEBE5;
  --slate:#4F6D86;--slateL:#E0E8EF;
  --red:#B4483A;--redL:#F6E1DD;--amber:#C99A2E;--amberL:#F6ECD2;
  --shadow:0 1px 2px rgba(28,36,34,.06),0 4px 14px rgba(28,36,34,.05);
  --r1:6px;--r2:10px;--r3:16px;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131917;--surface:#1B2320;--surface2:#212B28;--line:#2E3935;--line2:#3B4843;
    --ink:#E6ECE8;--ink2:#B4C0BA;--ink3:#84928B;
    --side:#0F1413;--side2:#1B2320;
    --cedar:#D08A45;--cedarD:#E29C57;--cedarL:#3A2B1C;
    --green:#56A38C;--greenD:#6DB8A1;--greenL:#1D3530;
    --slate:#7F9DB6;--slateL:#1F2B36;--red:#D9695A;--redL:#3A1F1B;--amber:#D9AE4A;--amberL:#3A311A;
    --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131917;--surface:#1B2320;--surface2:#212B28;--line:#2E3935;--line2:#3B4843;
  --ink:#E6ECE8;--ink2:#B4C0BA;--ink3:#84928B;
  --side:#0F1413;--side2:#1B2320;
  --cedar:#D08A45;--cedarD:#E29C57;--cedarL:#3A2B1C;
  --green:#56A38C;--greenD:#6DB8A1;--greenL:#1D3530;
  --slate:#7F9DB6;--slateL:#1F2B36;--red:#D9695A;--redL:#3A1F1B;--amber:#D9AE4A;--amberL:#3A311A;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
/* ---------- semantic task colors ----------
   One meaning per color, everywhere in Content HQ. The Calendar is the source of truth.
   Use these for accents (badges, left borders, chips, progress, small icons), not for big blocks.
   *-color = the accent, *-soft = a quiet tint behind it, *-ink = readable text on the tint. */
:root{
  --reel-color:#C2621B;--reel-soft:#FBE9DA;--reel-ink:#9A4A10;
  --longform-color:#1F7A54;--longform-soft:#DDF0E6;--longform-ink:#17603F;
  --filming-color:#2563A8;--filming-soft:#DFEAF7;--filming-ink:#1D4F88;
  --editing-color:#7B4BB3;--editing-soft:#ECE3F6;--editing-ink:#5F3790;
  --planning-color:#6B7672;--planning-soft:#EEF0EE;--planning-ink:#4B5752;
  --attention-color:var(--red);--attention-soft:var(--redL);
  --success-color:var(--green);--success-soft:var(--greenL);
  --data-color:#7D8A84;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --reel-color:#E8924F;--reel-soft:#3B2A1B;--reel-ink:#F0AE7A;
    --longform-color:#5FBF95;--longform-soft:#183428;--longform-ink:#86D3B0;
    --filming-color:#6FA8E8;--filming-soft:#1B2C42;--filming-ink:#9AC3F0;
    --editing-color:#B592E6;--editing-soft:#2D2440;--editing-ink:#CDB4F0;
    --planning-color:#94A19B;--planning-soft:#232C29;--planning-ink:#B4C0BA;
    --data-color:#84928B;
  }
}
:root[data-theme="dark"]{
  --reel-color:#E8924F;--reel-soft:#3B2A1B;--reel-ink:#F0AE7A;
  --longform-color:#5FBF95;--longform-soft:#183428;--longform-ink:#86D3B0;
  --filming-color:#6FA8E8;--filming-soft:#1B2C42;--filming-ink:#9AC3F0;
  --editing-color:#B592E6;--editing-soft:#2D2440;--editing-ink:#CDB4F0;
  --planning-color:#94A19B;--planning-soft:#232C29;--planning-ink:#B4C0BA;
  --data-color:#84928B;
}
/* Anything tagged with a semantic kind picks up --c (accent), --cl (tint) and --ci (text) */
.k-reel{--c:var(--reel-color);--cl:var(--reel-soft);--ci:var(--reel-ink)}
.k-long{--c:var(--longform-color);--cl:var(--longform-soft);--ci:var(--longform-ink)}
.k-film{--c:var(--filming-color);--cl:var(--filming-soft);--ci:var(--filming-ink)}
.k-edit{--c:var(--editing-color);--cl:var(--editing-soft);--ci:var(--editing-ink)}
.k-plan,.k-script{--c:var(--planning-color);--cl:var(--planning-soft);--ci:var(--planning-ink)}
.k-general,.k-pub{--c:var(--ink3);--cl:var(--surface2);--ci:var(--ink2)}
.k-metric{--c:var(--data-color);--cl:var(--surface2);--ci:var(--ink2)}
.kbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--cl);color:var(--ci);white-space:nowrap}
.kbadge .ic{width:12px;height:12px;color:var(--c)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
body.drawer-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:18px;height:18px;flex:none}
.ic.xs{width:13px;height:13px;vertical-align:-2px}
:focus-visible{outline:2px solid var(--cedar);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:600}
h1{font:600 34px/1.05 var(--fd);letter-spacing:.2px}
h2{font:600 20px/1.2 var(--fd);letter-spacing:.2px}
h3{font-size:16px}
h4{font-size:14px}
.muted{color:var(--ink3)}.sm{font-size:13px}.pad{padding:14px 18px}
.grow{flex:1}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-mark{display:flex;gap:3px;width:30px;height:30px;padding:5px;background:var(--side2);border-radius:8px}
.brand-mark i{flex:1;border-radius:2px;background:var(--cedar)}
.brand-mark i:nth-child(2){background:var(--green)}.brand-mark i:nth-child(3){background:#D9DED6}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font:600 21px var(--fd);letter-spacing:.3px}
.brand-text small{color:var(--sideInk2);font-size:12px}
#nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--sideInk2);font-size:14px;font-weight:500;position:relative}
.nav-i:hover{background:var(--side2);color:var(--sideInk)}
.nav-i.on{background:var(--side2);color:#fff}
.nav-i.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--cedar)}
.nav-i em{margin-left:auto;font-style:normal;font-size:12px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:10px;color:var(--sideInk)}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.store-note{font-size:12px;color:var(--sideInk2);margin:10px 4px 0}
.store-note.warn{color:#F2B8A8}
/* client switcher: neutral identity only, never the semantic task colors */
.cwrap{position:relative}
.side-cw{margin:-6px 0 14px}
.cl-av{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line2);font:600 13px/1 var(--fd);letter-spacing:.5px}
.client-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px 7px 7px;border-radius:9px;background:var(--side2);color:var(--sideInk);border:1px solid rgba(255,255,255,.08)}
.client-btn:hover{border-color:rgba(255,255,255,.22)}
.client-btn .cl-av{background:rgba(255,255,255,.08);color:var(--sideInk);border-color:rgba(255,255,255,.16)}
.client-btn .cl-n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.client-btn small{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--sideInk2)}
.client-btn b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-btn .ic{color:var(--sideInk2)}
.client-chip{display:inline-flex;align-items:center;gap:8px;max-width:280px;padding:3px 10px 3px 3px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.client-chip:hover{border-color:var(--ink3)}
.client-chip .cl-av{width:28px;height:28px;border-radius:50%}
.client-chip .cl-n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-chip .ic{color:var(--ink3)}
.menu.cmenu{left:0;right:auto;min-width:250px;color:var(--ink)}
.side-cw .cmenu{width:100%;min-width:0}
.menu button.cm-i{display:flex;align-items:center;gap:10px}
.cm-i .cl-av{width:24px;height:24px;font-size:12px}
.cm-i .cl-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-i[aria-checked="true"]::after{content:'✓';font-weight:700;color:var(--ink2)}
.cm-h{padding:6px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.cm-sep{height:1px;background:var(--line);margin:6px 4px}
.cl-rows{list-style:none;margin:0;padding:0}
.cl-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cl-row-t{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl-row-t b{font-weight:600}
.cl-row-t span{font-size:12.5px;color:var(--ink3);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cl-row.arch .cl-row-t b,.cl-row.arch .cl-av{opacity:.6}
.cl-act{display:flex;gap:6px;flex-wrap:wrap}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:12px;align-items:center;padding:14px 28px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;color:var(--ink3)}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%;color:var(--ink)}
.search:focus-within{border-color:var(--cedar)}
#addwrap{margin-left:auto;position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 12px 30px rgba(0,0,0,.14);padding:6px;min-width:220px;z-index:30}
.menu.open{display:block}
.menu button{display:block;width:100%;padding:9px 12px;border-radius:7px;font-weight:500}
.menu button:hover{background:var(--surface2)}
#main{outline:none}
.page{padding:26px 28px 60px;max-width:1280px}
.page.wide{max-width:none}.page.narrow{max-width:820px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .12s,border-color .12s}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn.accent{background:var(--cedar);color:#fff}.btn.accent:hover{background:var(--cedarD)}
.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--greenD)}
.btn.ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}.btn.ghost:hover{border-color:var(--ink3)}
.btn.ghost-light{border-color:rgba(255,255,255,.18);color:var(--sideInk)}.btn.ghost-light:hover{background:var(--side2)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger.ghost{background:none;color:var(--red);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.file{position:relative}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--ink2)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.sm{width:26px;height:26px}.icon-btn.sm .ic{width:15px;height:15px}
.link,.link-b{color:var(--green);font-weight:600;font-size:13px}
.link-b{font-size:inherit;text-align:left}
.link:hover,.link-b:hover{text-decoration:underline}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}

/* ---------- page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sub{margin:6px 0 0;color:var(--ink2)}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--ink2)}
.mnav span{min-width:120px;text-align:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg.wrap{flex-wrap:wrap;margin-bottom:18px}
.seg button{padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
label.inline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin-top:6px}
.card-b{padding:16px 18px}
.count{font-size:12px;font-weight:600;color:var(--ink3);background:var(--surface2);border:1px solid var(--line);padding:1px 8px;border-radius:10px;font-family:var(--fb)}
.empty{padding:28px 20px;text-align:center;color:var(--ink3)}
.empty p{margin:0 0 12px;max-width:440px;margin-inline:auto}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cols2.even{grid-template-columns:1fr 1fr}
.cols2>*,.cols2.plan>*{min-width:0}
.cols2.plan{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}

/* ---------- dashboard hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:22px 24px 20px;margin-bottom:18px}
.hero-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero-h .mnav{margin-left:-8px;margin-bottom:4px}
.hero h1{font-size:44px}
.boards{display:flex;flex-direction:column;gap:5px;margin-bottom:20px;padding:10px;background:repeating-linear-gradient(90deg,var(--surface2) 0 1px,transparent 1px 120px),var(--surface2);border-radius:var(--r2);border:1px solid var(--line)}
.plank{--c:var(--cedar);--cl:var(--cedarL);position:relative;display:flex;align-items:center;min-height:42px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.plank.long{--c:var(--green);--cl:var(--greenL);min-height:52px}
.plank .meter{position:absolute;inset:0;pointer-events:none}
.plank .meter i{position:absolute;left:0;top:0;bottom:0;width:var(--fill);background:var(--cl);transition:width .4s ease}
.plank::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);z-index:1}
.plank.done .meter i{background:var(--c);opacity:.22}
.plank:hover{border-color:var(--c)}
.pl-body{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:0 14px 0 18px}
.pl-date{font:600 15px var(--fd);color:var(--ink2);letter-spacing:.3px}
.pl-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plank.long .pl-title{font-size:16px}
.pl-status{font-size:12px;font-weight:600;color:var(--c)}
.plank.empty{background:transparent;border-style:dashed;border-color:var(--line2)}
.plank.empty::before{opacity:.35}
.plank.empty .pl-title{color:var(--ink3);font-weight:500}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{padding:4px 2px}
.pc-top{display:flex;justify-content:space-between;align-items:baseline}
.pc-l{font-weight:600;color:var(--ink2);font-size:14px}
.pc-n{font:500 16px var(--fd);color:var(--ink3)}.pc-n b{font-size:26px;color:var(--ink);font-weight:600}
.pbar{height:8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;margin:6px 0}
.pbar i{display:block;height:100%}
.pbar .p1{background:var(--green)}.pbar .p2{background:var(--cedar);opacity:.6}
.pc-s{font-size:12px;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr) 1.4fr 1.4fr;gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--line2)}
.tn{font:600 30px/1 var(--fd)}.tn.sm{font-size:20px;line-height:1.2}
.tl{font-size:12.5px;color:var(--ink3);font-weight:500}
.rail .card-h{padding:12px 16px}
.mini{list-style:none;margin:0;padding:6px}
.mini li button{display:flex;flex-direction:column;width:100%;padding:8px 10px;border-radius:7px}
.mini li button:hover{background:var(--surface2)}
.mini li b{font-weight:600;font-size:14px;line-height:1.3}
.mini li span{font-size:12.5px;color:var(--ink3)}
.mini li.split{display:flex;align-items:center}
.mini li.split button:first-child{flex:1}
.mini li.split .icon-btn{width:32px;flex:none;display:grid}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.clickable tbody tr{cursor:pointer}
.tbl.clickable tbody tr:hover td{background:var(--surface2)}
.tbl .t{font-weight:600;min-width:200px}
.tbl .nw{white-space:nowrap}.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.late td:first-child{color:var(--red)}
.late-tag{font-size:11px;font-weight:600;background:var(--redL);color:var(--red);padding:1px 6px;border-radius:5px}
.tbl.perf td{padding:6px 8px}
.cellin{width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.cellin:focus{border-color:var(--cedar);outline:none;background:var(--surface)}
.star{color:var(--amber);margin-right:6px}.star .ic{width:14px;height:14px;fill:currentColor;vertical-align:-2px}
.star-btn.on{color:var(--amber)}.star-btn.on .ic{fill:currentColor}

/* ---------- pills, tags, chips ---------- */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
/* status follows the work stage: scripting = planning gray, filming = blue, editing = purple, posted = success */
.pill.st1{background:var(--planning-soft);color:var(--planning-ink);border-color:transparent}
.pill.st2{background:var(--surface);color:var(--filming-ink);border-color:var(--filming-color)}
.pill.st3{background:var(--filming-soft);color:var(--filming-ink);border-color:transparent}
.pill.st4{background:var(--editing-soft);color:var(--editing-ink);border-color:transparent}
.pill.st5,.pill.st6{background:var(--surface);color:var(--ink);border-color:var(--ink3)}
.pill.st7{background:var(--success-soft);color:var(--greenD);border-color:transparent}
.pill.st7::before{content:'✓ '}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.2px}
.tag.reel{background:var(--reel-soft);color:var(--reel-ink)}
.tag.long{background:var(--longform-soft);color:var(--longform-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;align-items:center}
.chip{display:inline-block;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-weight:500}
button.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.sm{font-size:12px;padding:1px 8px;border-color:var(--line)}
.chip.soft{background:var(--surface2)}
.sumline{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;font-size:14px}

/* ---------- calendar ---------- */
/* Calendar event colors are the shared semantic colors (defined once at the top) */
:root{--evReel:var(--reel-color);--evReelL:var(--reel-soft);--evLong:var(--longform-color);--evLongL:var(--longform-soft);--evFilm:var(--filming-color);--evFilmL:var(--filming-soft);--evEdit:var(--editing-color);--evEditL:var(--editing-soft);--evMisc:var(--planning-color);--evMiscL:var(--planning-soft)}
.page.calpage{max-width:none;padding:20px 22px 50px}
.cal-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav .icon-btn{width:36px;height:36px;background:var(--surface);border:1px solid var(--line2)}
.cal-nav .icon-btn:hover{border-color:var(--ink3)}
.cal-title{min-width:216px;text-align:center;white-space:nowrap}
.cal-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend .cchip{width:auto;align-items:center;font-size:12.5px;font-weight:600;padding:4px 9px 4px 7px}
.legend .cchip .ic{margin-top:0}
.legend em{font-style:normal;font-weight:700;color:var(--c);padding-left:2px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface2);border-bottom:1px solid var(--line)}
.cal-dow span{padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);margin-bottom:-1px}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface2)}
.cell.out{background:var(--surface2)}.cell.out .dnum{color:var(--ink3)}.cell.out .cchip{opacity:.55}
.cell.today{background:color-mix(in srgb,var(--cedarL) 45%,var(--surface))}
.dhead{display:flex;align-items:center;gap:7px;min-height:26px}
.dnum{font:600 18px/26px var(--fd);color:var(--ink);min-width:26px;text-align:center;border-radius:13px;padding:0 5px}
.cell.today .dnum{background:var(--cedar);color:#fff;padding:0 8px}
.dtag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--cedarD)}
.cchips{display:flex;flex-direction:column;gap:5px;min-width:0}
.cchip{display:flex;align-items:flex-start;gap:6px;width:100%;min-width:0;font-size:13px;line-height:1.3;font-weight:500;text-align:left;padding:5px 7px 5px 6px;border-radius:6px;border:1px solid transparent;border-left:4px solid var(--c);background:var(--cl);color:var(--ink)}
.cchip .ic{width:14px;height:14px;margin-top:1.5px;color:var(--c)}
.cchip .ct{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-width:0;word-break:break-word}
.cchip b{font-weight:700;color:var(--c)}
.cchip.reel{--c:var(--evReel);--cl:var(--evReelL)}
.cchip.long{--c:var(--evLong);--cl:var(--evLongL)}
.cchip.film{--c:var(--evFilm);--cl:var(--surface);border-color:var(--c)}
.cchip.edit{--c:var(--evEdit);--cl:var(--surface);border-color:var(--c)}
.cchip.script,.cchip.plan{--c:var(--evMisc);--cl:var(--evMiscL)}
.cchip.plan{border-style:dashed;border-color:var(--c);border-left-style:solid}
.cchip.done{opacity:.5}.cchip.done .ct{text-decoration:line-through}
button.cchip:hover{box-shadow:0 0 0 1px var(--c)}
.more{font-size:12px;font-weight:600;color:var(--ink3);padding:0 4px}
.daypanel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.daypanel h2{margin-bottom:12px}
.daylist{display:flex;flex-direction:column;gap:14px}
.daylist .cchip{width:auto;display:inline-flex;font-size:12.5px;font-weight:600;align-items:center}
.daylist .cchip .ic{margin-top:0}
.daylist ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:7px}
.daylist li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding-left:10px;border-left:2px solid var(--line)}
.daylist li .link-b{flex:1 1 160px;min-width:0}
.dmeta{flex-basis:100%;font-size:12.5px;color:var(--ink3)}
.cal-agenda{display:none}
.modal.xl{width:min(1000px,calc(100vw - 32px))}
.share-prev{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r1);background:#fff}
.share-scroll{max-height:56vh;overflow:auto;border-radius:var(--r1)}
@media (min-width:1500px){
  .cal-wrap{grid-template-columns:minmax(0,1fr) 330px}
  .daypanel{display:block}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
}
@media (max-width:1100px){
  .cal-grid{grid-auto-rows:minmax(124px,auto)}
  .cell{padding:6px 5px}
  .cchip{font-size:12px;gap:4px;padding:4px 5px 4px 4px;border-left-width:3px}
  .cchip .ic{width:13px;height:13px}
  .cchip .ct{-webkit-line-clamp:3}
}
@media (max-width:700px){
  .page.calpage{padding:14px 10px 40px}
  .cal-title{min-width:0;flex:1}
  .cal-nav{flex:1}
  .cal-tools{margin-left:0;width:100%}
  .cal-tools .btn{margin-left:auto}
  .cal-dow span{padding:7px 0;text-align:center;font-size:10.5px;letter-spacing:.03em}
  .cal-grid{grid-auto-rows:minmax(70px,auto)}
  .cell{padding:4px 3px;gap:4px;align-items:center}
  .dhead{min-height:24px}.dnum{font-size:16px;line-height:24px;min-width:24px}
  .dtag{display:none}
  .cell .cchips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .cell .cchip{width:21px;height:21px;padding:0;align-items:center;justify-content:center;border:0;background:var(--c);border-radius:5px}
  .cell .cchip .ic{color:#fff;margin:0}
  .cell .cchip .ct{display:none}
  .more{font-size:10.5px;padding:0}
  .cal-agenda{display:block;margin-top:18px}
  .cal-agenda>h2{margin-bottom:10px}
  .ag-day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px;margin-bottom:8px}
  .ag-day>button{font:600 17px var(--fd);margin-bottom:8px;display:block;width:100%}
  .ag-day .cchip{font-size:13.5px;padding:7px 9px 7px 7px}
}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;max-height:calc(100vh - 210px);transition:border-color .12s,background .12s}
.kcol.over{border-color:var(--cedar);background:var(--cedarL)}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px}
.kcol-h h3{font:600 17px var(--fd);letter-spacing:.3px}
.kcol-b{padding:4px 8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kempty{font-size:13px;color:var(--ink3);text-align:center;border:1px dashed var(--line2);border-radius:8px;padding:16px;margin:0}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--reel-color);border-radius:8px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.kcard.is-long{border-left-color:var(--longform-color)}
.kcol[data-stage]{border-top:3px solid var(--c)}
.kcard:hover{border-color:var(--line2)}
.kcard.dragging{opacity:.45}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.kc-date{font-size:12px;color:var(--ink3);font-weight:500}
.kcard h4{font-size:14px;line-height:1.3;margin-bottom:6px}
.kc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.kc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}

/* ---------- idea bank ---------- */
.qa{padding:12px}
.qa-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qa-row input,.qa-row select{padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
.qa-row label.grow input{width:100%}
.qa-row label.grow{min-width:240px}
.grp{margin-bottom:24px}
.grp h2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;justify-content:space-between;padding:4px 4px 12px}
.idea:hover{border-color:var(--line2)}
.idea>.btn{margin:0 12px;align-self:flex-start}
.idea-main{display:grid;grid-template-columns:10px 1fr;gap:4px 10px;padding:10px 10px 10px 12px;align-items:start}
.prio{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line2)}
.prio.p-High{background:var(--cedar)}.prio.p-Medium{background:var(--amber)}
.idea-t{font-weight:600;line-height:1.35}
.idea-m{grid-column:2;display:flex;flex-wrap:wrap;gap:5px}
.idea-n{grid-column:2;font-size:13px;color:var(--ink3);line-height:1.4}

/* ---------- this month / lists ---------- */
.mlist{list-style:none;margin:0;padding:4px 0}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.k-reel,.mrow.k-long{box-shadow:inset 3px 0 0 var(--c)}
.mrow-t{flex:1;display:flex;flex-direction:column;min-width:0}
.mrow-t b{font-weight:600}
.mrow-t span{font-size:12.5px;color:var(--ink3)}
.mrow.done .mrow-t b{text-decoration:line-through;color:var(--ink3)}
.chk{display:inline-flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:14px;line-height:1.35}
.chk input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;flex:none;border:1.5px solid var(--line2);border-radius:5px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin-top:1px}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:disabled{cursor:default}
.chk.sm{font-size:13px;color:var(--ink2);margin-left:6px}
.chk.big{font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);align-items:center}
.chk.big input{width:22px;height:22px}
.chk.big:has(input:checked){background:var(--greenL);border-color:transparent}

/* ---------- need to film ---------- */
.fcard{padding:18px 20px;border-left:3px solid var(--filming-color)}
.fc-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.fc-h h3{font:600 22px/1.15 var(--fd);margin-top:6px}
.due{font-weight:600;font-size:13px;background:var(--filming-soft);color:var(--filming-ink);padding:4px 10px;border-radius:6px;white-space:nowrap}
.due.late{background:var(--redL);color:var(--red)}
.fc-s{padding:10px 0;border-top:1px solid var(--line)}
.fc-s h4{font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:6px}
.fc-s p{margin:0}
.pre{white-space:pre-line}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin-bottom:10px}
.fc-f{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
h2.sect{margin:26px 0 12px}

/* ---------- filters, forms ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink3)}
select,input[type=text],input[type=date],input[type=month],input[type=number],input[type=url],input:not([type]),textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0}
textarea{resize:vertical;line-height:1.45;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cedar);box-shadow:0 0 0 3px var(--cedarL)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:12px}
.form-grid.two{grid-template-columns:1fr 1fr}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;padding:0;margin:0 0 4px}
.fld.wide{grid-column:1/-1}
.fld label,.fld legend{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%}
.plats{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px}

/* ---------- performance ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;display:flex;flex-direction:column}
.kpis b{font:600 28px/1.1 var(--fd)}
.kpis span{font-size:12.5px;color:var(--ink3)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 18px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bt{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--green);border-radius:4px}
.bv{text-align:right;font-weight:600}
.colchart{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col i{width:100%;max-width:46px;background:var(--cedar);border-radius:4px 4px 0 0}
.cv{font-size:11.5px;font-weight:600;color:var(--ink2)}
.cl{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 18px}
.dl{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:0 0 14px;font-size:14px}
.dl dt{color:var(--ink3);font-weight:600;font-size:12.5px}
.dl dd{margin:0}

/* ---------- templates ---------- */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.tpl-col h4{font:600 17px var(--fd);margin-bottom:6px}
.tpl-col ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.8}
.tpl-col ul.tpl-check{list-style:none;padding:0}
.tpl-col ul.tpl-check li::before{content:'';display:inline-block;width:12px;height:12px;border:1.5px solid var(--line2);border-radius:3px;margin-right:9px;vertical-align:-1px}
.js-h{font:600 20px var(--fd);margin:20px 0 10px}
.js-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:20px}
.sug-i{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--surface2)}
.sug-i h4{margin-bottom:4px;font-size:14.5px}
.sug-i p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.sug-i .btn{align-self:flex-start}
.pillars{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pillars h4{font:600 18px var(--fd)}
.pillars p{margin:4px 0 0;font-size:13.5px}

/* ---------- plan ---------- */
.steps{list-style:none;padding:0;margin:14px 0 8px;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li em{font-style:normal;font-size:12px;color:var(--ink3);white-space:nowrap}
.steps li.done .chk span{color:var(--ink3)}
.slots{list-style:none;padding:0;margin:12px 0 0}
.slot{display:grid;grid-template-columns:96px 120px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.slot:last-child{border-bottom:0}
.slot-d{font:600 15px var(--fd);color:var(--ink2)}
.slot-k{font-size:12px;font-weight:600}
.slot-k.reel{color:var(--reel-ink)}.slot-k.long{color:var(--longform-ink)}
.slot-c{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot-pick{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.slot-pick select{flex:1;min-width:150px;font-size:13px;padding:6px 8px}
.plan-mini .card-b .btn{margin-top:4px}
.plan-mini p{margin:6px 0}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,19,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(30px);opacity:0;transition:transform .2s ease,opacity .2s ease;outline:none}
.drawer.open{transform:none;opacity:1}
.drawer.still{transition:none}
.dr-h{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
.dr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.dr-ctl{margin-left:auto;display:flex;gap:2px;align-items:center}
/* Resizable editor panel (desktop only). Width lives in --drw on <html> so it survives re-renders. */
.dr-resize{display:none}
body.dr-resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.dr-resizing .drawer{transition:none}
@media (min-width:1024px){
  .drawer{width:var(--drw,min(max(720px,50vw),80vw))}
  .dr-resize{display:block;position:absolute;left:-6px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:3;touch-action:none;outline:none}

@media (max-width:1100px){.home-cols{grid-template-columns:1fr}}

<script>
(function(){
'use strict';

/* ================= constants ================= */
const LS_KEY='contentHQ.deck.v1';

 {name:'Projects',purpose:'Show craftsmanship and finished work.',ex:['Finished deck walkthrough','Before and after','Construction progress','Project reveal','Customer project story']},

const SCRIPT_TYPES={
 'Educational':{flow:['Hook','Answer','Why','Example','CTA'],labels:['Answer / Point 1','Why It Matters','Example / Proof'],

/* ---------- Numbered talking points ---------- */
/* Each block is one talking point with its own B-roll and captured state. Numbers come from array order, never stored. */
const blankBlock=()=>({id:uid(),text:'',broll:'',captured:false});
const mkBlocks=texts=>texts.map(t=>Object.assign(blankBlock(),{text:t}));
const LIST_MARK=/^\s*(?:[-–—•*·▪◦‣●○]+\s*|\(?\d{1,2}[.):]\s+)/;
/* Splits old freeform text into points: bullets, numbered lines, paragraphs, or plain lines. Text is regrouped, never dropped. */
function splitPoints(raw){
  const txt=String(raw==null?'':raw).replace(/\r/g,''), lines=txt.split('\n'), full=lines.filter(l=>l.trim());
  const marked=full.filter(l=>LIST_MARK.test(l)).length;
  if(marked&&marked*2>=full.length){
    const out=[];
    lines.forEach(l=>{
      if(LIST_MARK.test(l))out.push(l.replace(LIST_MARK,'').trim());
      else if(l.trim()){if(out.length)out[out.length-1]=(out[out.length-1]+'\n'+l.trim()).trim();else out.push(l.trim());}
    });
    return out.filter(Boolean);
  }
  const paras=txt.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(paras.length>1&&paras.some(x=>x.includes('\n')))return paras;
  return full.map(l=>l.replace(LIST_MARK,'').trim()).filter(Boolean);
}
/* Pairs old B-roll lines with points only when the match is clear: explicitly numbered, or the same number of lines as points.
   Anything else stays where it was, in the general B-roll notes. */
function pairBroll(blocks,raw){
  const n=blocks.length;raw=String(raw==null?'':raw);
  if(n<2||!raw.trim())return false;
  const lines=raw.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const nums=lines.map(l=>{const x=l.match(/^\s*\(?(\d{1,2})[.):]\s+/);return x?+x[1]:0;});
  let map=null;
  if(nums.every(x=>x>=1&&x<=n)&&new Set(nums).size===nums.length)map=nums.map(x=>x-1);
  else if(lines.length===n)map=lines.map((l,i)=>i);
  if(!map)return false;
  lines.forEach((l,i)=>{blocks[map[i]].broll=l.replace(LIST_MARK,'').trim();});
  return true;
}
function matchBroll(m){if(pairBroll(m.blocks,m.broll)){m.brollLegacy=m.broll;m.broll='';}}
const cleanBlocks=list=>{const out=list.filter(b=>b&&typeof b==='object').map(b=>Object.assign({},b,{id:b.id||uid(),text:String(b.text==null?'':b.text),broll:String(b.broll==null?'':b.broll),captured:!!b.captured}));if(!out.length)out.push(blankBlock());return out;};
/* Long-form sections: the old one-per-line talking points become numbered blocks. B-roll that cannot be paired line for line
   goes on the first point in full, so nothing is dropped. */
function sectionBlocks(text,visual){
  const blocks=mkBlocks(splitPoints(text)), v=String(visual==null?'':visual);
  if(v.trim()){if(!blocks.length)blocks.push(blankBlock());if(!pairBroll(blocks,v))blocks[0].broll=v.trim();}
  if(!blocks.length)blocks.push(blankBlock());
  return blocks;
}
const SHOT_TYPES=['A-roll','B-roll','Screen Recording','Photo','Drone','Before / After','Other'];
const mkSec=(title,text,visual)=>({title:title,visual:'',blocks:sectionBlocks(text,visual)});
/* Reels: the old Custom talking points text becomes numbered blocks. The original is kept in talkingLegacy. */
function absorbTalking(m){
  if(m.type==='Long Form'||!String(m.talking==null?'':m.talking).trim())return;
  const pts=splitPoints(m.talking), have=m.blocks.filter(b=>b.text.trim());
  if(!Array.isArray(m.legacyPoints))m.legacyPoints=[];
  if(have.length)m.legacyPoints=m.legacyPoints.concat(pts);
  else m.blocks=mkBlocks(pts);
  m.talkingLegacy=m.talking;m.talking='';
}
function migrateBlocks(m){
  const key=x=>x.toLowerCase().replace(/\s+/g,' ');
  const pts=(Array.isArray(m.points)?m.points:[]).map(x=>String(x==null?'':x).trim()).filter(Boolean);
  m.blocks=[];m.legacyPoints=Array.isArray(m.legacyPoints)?m.legacyPoints:[];
  if(m.type!=='Long Form'&&String(m.talking==null?'':m.talking).trim()){
    // custom talking points always won over the three point fields, so they become the script and the others are set aside
    absorbTalking(m);
    const seen=m.blocks.map(b=>key(b.text));
    m.legacyPoints=m.legacyPoints.concat(pts.filter(x=>!seen.includes(key(x))));
  }else m.blocks=mkBlocks(pts);
  if(m.type!=='Long Form')matchBroll(m);
  if(!m.blocks.length)m.blocks.push(blankBlock());
}

/* ---------- pack helpers ---------- */
const own=(o,k)=>!!o&&typeof o==='object'&&Object.prototype.hasOwnProperty.call(o,k);

const pclone=o=>JSON.parse(JSON.stringify(o));
const BAD_KEY=/^(__proto__|constructor|prototype)$/i;
/* Keys that end up in saved paths (shots.<key>, recap.<key>) are letters, numbers, - and _ only */
function keyOf(k,label){
  let x=String(k==null?'':k).replace(/[^A-Za-z0-9_-]/g,'').slice(0,30);
  if(!x)x=String(label||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
  if(BAD_KEY.test(x))x='k-'+x;
  return x;
}
/* Every pack that comes in (saved data, a file, an AI answer, Edit wording) goes through here. It strips HTML, caps lengths,

    s=multi?t.replace(/\r\n?/g,'\n').replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g,''):t.replace(/[\u0000-\u001f\u007f]+/g,' ');
    s=s.trim();if(s.length>max){cut=true;s=s.slice(0,max).trim();}
    return s;
  };
  const cap=(list,max,label)=>{if(list.length>max){W.push(label+': kept the first '+max+' of '+list.length+'.');return list.slice(0,max);}return list;};
  const uniq=(list,keyFn)=>{const seen=Object.create(null);return list.filter(x=>{const k=String(keyFn?keyFn(x):x).toLowerCase();if(!k)return false;if(seen[k]){dups++;return false;}seen[k]=1;return true;});};
  const strs=(v,max,n,label)=>cap(uniq((Array.isArray(v)?v:[]).map(x=>str(x,max)).filter(Boolean)),n,label);
  // A section that is missing comes from NEUTRAL_PACK. One that is there but is not a list is left empty.
  const listOr=(k,label,fn)=>{
    if(!own(src,k)||src[k]==null){missing.push(label);return pclone(N[k]);}
    if(!Array.isArray(src[k])){W.push(label+' was not a list, so it was left empty.');return [];}
    return fn(src[k]);
  };
  const mapOf=(v,n,valFn)=>{const o={};if(isPlain(v))Object.keys(v).slice(0,n).forEach(k=>{const kk=str(k,40), val=valFn(v[k]);if(kk&&!BAD_KEY.test(kk)&&val)o[kk]=val;});return o;};
  const pillars=listOr('pillars','Pillars',v=>cap(uniq(v.map(p=>isPlain(p)?{name:str(p.name,40),purpose:str(p.purpose,200),ex:strs(p.ex,60,12,'Pillar examples')}:{name:str(p,40),purpose:'',ex:[]}).filter(p=>p.name),p=>p.name),15,'Pillars'));
  const topics=listOr('topics','Topics',v=>strs(v,40,30,'Topics'));
  const groups=listOr('groups','Groups',v=>strs(v,40,12,'Groups'));
  const groupFor=mapOf(src.groupFor,80,g=>str(g,40));
  const dsrc=isPlain(src.defaults)?src.defaults:{}, defaults={};
  ['pillar','topic','group','recapPillar','recapTopic'].forEach(k=>{defaults[k]=str(dsrc[k],40);});
  const sx=isPlain(src.scriptTypeFor)?src.scriptTypeFor:{}, isType=t=>typeof t==='string'&&own(SCRIPT_TYPES,t)?t:'';
  const scriptTypeFor={topics:mapOf(sx.topics,40,isType),pillars:mapOf(sx.pillars,40,isType)};
  const lib=(k,label)=>listOr(k,label,v=>{
    const byCat=Object.create(null), out=[];
    v.forEach(g=>{
      if(!isPlain(g))return;
      const cat=str(g.cat,40)||'Other', ck=cat.toLowerCase(), items=(Array.isArray(g.items)?g.items:[]).map(x=>str(x,240)).filter(Boolean);
      if(!byCat[ck]){byCat[ck]={cat:cat,items:[]};out.push(byCat[ck]);}
      byCat[ck].items=byCat[ck].items.concat(items);
    });
    return cap(out.map(e=>({cat:e.cat,items:cap(uniq(e.items),15,label+' ('+e.cat+')')})).filter(e=>e.items.length),12,label+' categories');
  });
  const hookLibrary=lib('hookLibrary','Hooks'), ctaLibrary=lib('ctaLibrary','CTAs'), captionOpenings=lib('captionOpenings','Caption openings');
  let hashtagGroups={};
  if(!own(src,'hashtagGroups')||src.hashtagGroups==null)missing.push('Hashtag groups');
  else{
    const v=src.hashtagGroups;let pairs=[];
    if(Array.isArray(v))pairs=v.map(x=>Array.isArray(x)?[x[0],x[1]]:isPlain(x)?[x.name,x.tags]:null).filter(Boolean);
    else if(isPlain(v))pairs=Object.keys(v).map(k=>[k,v[k]]);
    else W.push('Hashtag groups were not in the right format, so they were left empty.');
    const seen=Object.create(null);let n=0;
    pairs.forEach(p=>{
      let g=str(p[0],40).replace(/\./g,'').trim();if(!g||BAD_KEY.test(g))return;
      if(g.toLowerCase()==='custom')g='Custom tags';   // "Custom" is the built-in choice for typing tags per video
      const k=g.toLowerCase();if(seen[k]){dups++;return;}seen[k]=1;
      if(++n>10){if(n===11)W.push('Hashtag groups: kept the first 10.');return;}
      hashtagGroups[g]=str(p[1],2000,true);

  }
  const pairList=(k,label,max)=>listOr(k,label,v=>{
    const used=Object.create(null);
    return cap(uniq(v.map(x=>{
      let key='',lab=x;
      if(Array.isArray(x)){key=x[0];lab=x[1];}else if(isPlain(x)){key=x.key;lab=x.label;}
      lab=str(lab,60);if(!lab)return null;
      const base=keyOf(key,lab)||'item';let kk=base,i=2;while(used[kk.toLowerCase()])kk=base+'-'+(i++);used[kk.toLowerCase()]=1;
      return [kk,lab];
    }).filter(Boolean),x=>x[1]),max,label);
  });
  const shotList=pairList('shotList','Shot list',16), recapFields=pairList('recapFields','Recap fields',16);
  const captureChecklist=listOr('captureChecklist','Capture checklist',v=>{
    const byG=Object.create(null), out=[];
    v.forEach(x=>{
      if(!isPlain(x))return;
      const g=str(x.g!=null?x.g:x.name,40).replace(/\./g,'').trim()||'Shots', gk=g.toLowerCase(), items=(Array.isArray(x.items)?x.items:[]).map(i=>str(i,80)).filter(Boolean);
      if(!byG[gk]){byG[gk]={g:g,items:[]};out.push(byG[gk]);}
      byG[gk].items=byG[gk].items.concat(items);
    });
    return cap(out.map(e=>({g:e.g,items:cap(uniq(e.items),30,'Checklist ('+e.g+')')})).filter(e=>e.items.length),6,'Checklist sections');
  });
  const shv=isPlain(src.scriptHints)?src.scriptHints:{}, scriptHints={};let hintsFilled=false;
  SCRIPT_TYPE_NAMES.forEach(n=>{
    const x=own(shv,n)&&isPlain(shv[n])?shv[n]:{}, nn=N.scriptHints[n], ph=Array.isArray(x.ph)?x.ph:[];
    scriptHints[n]={ph:[0,1,2].map(i=>str(ph[i],160)||(hintsFilled=true,nn.ph[i])),hookPh:str(x.hookPh,160)||(hintsFilled=true,nn.hookPh)};
  });
  let textFilled=false;
  const textSet=(k,keys,max)=>{const v=isPlain(src[k])?src[k]:{}, o={};keys.forEach(x=>{const s=own(v,x)?str(v[x],max):'';if(!s)textFilled=true;o[x]=s||N[k][x];});return o;};
  const labels=textSet('labels',LABEL_KEYS,200), phrases=textSet('phrases',PHRASE_KEYS,120);
  const prv=isPlain(src.promptRules)?src.promptRules:{}, promptRules={};
  ['script','caption'].forEach(k=>{promptRules[k]=Array.isArray(prv[k])?strs(prv[k],200,8,'AI rules'):pclone(N.promptRules[k]);});
  const pfv=isPlain(src.projectForm)?src.projectForm:{}, projectForm={};
  PROJ_FIELDS.forEach(k=>{
    const x=isPlain(pfv[k])?pfv[k]:{}, nn=N.projectForm[k];
    projectForm[k]={label:str(x.label,40)||nn.label,ph:own(x,'ph')?str(x.ph,80):nn.ph,fallback:own(x,'fallback')?str(x.fallback,80):nn.fallback};
  });
  const projectIdeas=listOr('projectIdeas','Project ideas',v=>cap(v.filter(isPlain).map(x=>{
    const o={label:str(x.label,60),format:x.format==='Reel'||x.format==='Long Form'?x.format:'',pillar:str(x.pillar,40),topic:str(x.topic,40),title:str(x.title,160),note:str(x.note,240)};
    if(!o.label)o.label=o.title;if(!o.title)o.title=o.label;return o;
  }).filter(x=>x.title),20,'Project ideas'));
  const pp=src.postedPreset, postedPreset=isPlain(pp)&&str(pp.label,60)&&str(pp.pillar,40)?{label:str(pp.label,60),pillar:str(pp.pillar,40)}:null;
  const pack={format:PACK_FORMAT,version:1,name:str(src.name,60)||'Untitled wording',description:str(src.description,300),
    source:typeof src.source==='string'&&PACK_SOURCES.includes(src.source)?src.source:'custom',
    voice:str(src.voice,400),terms:{audience:str(isPlain(src.terms)?src.terms.audience:'',200)},
    pillars:pillars,topics:topics,groups:groups,groupFor:groupFor,defaults:defaults,scriptTypeFor:scriptTypeFor,
    hookLibrary:hookLibrary,ctaLibrary:ctaLibrary,captionOpenings:captionOpenings,hashtagGroups:hashtagGroups,
    shotList:shotList,captureChecklist:captureChecklist,recapFields:recapFields,scriptHints:scriptHints,
    labels:labels,phrases:phrases,promptRules:promptRules,projectForm:projectForm,projectIdeas:projectIdeas,postedPreset:postedPreset};
  if(missing.length)W.unshift('Missing, so left empty: '+missing.join(', ')+'.');
  if(hintsFilled)W.push('Some script hints were missing and use neutral wording.');
  if(textFilled)W.push('Some labels were missing and use neutral wording.');
  if(dups)W.push('Removed '+dups+' duplicate'+(dups===1?'':'s')+'.');
  if(html)W.push('Removed HTML from some text.');
  if(cut)W.push('Shortened some text that was too long.');
  return {pack:pack,warnings:W};
}

function rhythmDates(key){
  const y=+key.slice(0,4), m=+key.slice(5,7)-1;
  const first=new Date(y,m,1), last=new Date(y,m+1,0).getDate();
  const lastS=key+'-'+pad(last), firstS=key+'-01';
  let mon=1+((8-first.getDay())%7);
  const build=mo=>RHYTHM.map(r=>{const d=new Date(y,m,mo+r.w*7+(r.dow-1));return Object.assign({},r,{date:ds(d)});});
  let out=build(mon);
  if(out[7].date>lastS){mon-=7;out=build(mon);}
  return out.map(r=>Object.assign({},r,{date:r.date<firstS?firstS:(r.date>lastS?lastS:r.date)}));
}

function normalize(it){
  const base=newItem(it.type||'Reel');

  ['perf','recap','shots','prod','ytLinks'].forEach(k=>{m[k]=Object.assign({},base[k],it[k]||{});});
  if(!Array.isArray(m.points))m.points=['','',''];
  while(m.points.length<3)m.points.push('');
  // Numbered talking points: items saved before this existed are built from the old point fields, custom talking points and B-roll
  if(Array.isArray(it.blocks)){
    m.blocks=cleanBlocks(it.blocks);
    m.legacyPoints=Array.isArray(it.legacyPoints)?it.legacyPoints.map(String):[];
  }else{m.legacyPoints=[];migrateBlocks(m);}
  // Shot list: production state for script shots is keyed by stable ids, manual shots are their own records. Older items simply start empty.
  const sm=it.shotMeta&&typeof it.shotMeta==='object'&&!Array.isArray(it.shotMeta)?it.shotMeta:{};
  m.shotMeta={};Object.keys(sm).forEach(k=>{const x=sm[k];if(x&&typeof x==='object')m.shotMeta[k]={captured:!!x.captured,used:!!x.used,notes:String(x.notes==null?'':x.notes)};});
  const shotRec=x=>({id:x.id||uid(),ref:String(x.ref==null?'':x.ref),type:SHOT_TYPES.includes(x.type)?x.type:'B-roll',desc:String(x.desc==null?'':x.desc),captured:!!x.captured,used:!!x.used,notes:String(x.notes==null?'':x.notes)});
  m.manualShots=(Array.isArray(it.manualShots)?it.manualShots:[]).filter(x=>x&&typeof x==='object').map(shotRec);
  m.shotArchive=(Array.isArray(it.shotArchive)?it.shotArchive:[]).filter(x=>x&&typeof x==='object').map(shotRec);
  if(!Array.isArray(m.sections))m.sections=['','','','',''];
  while(m.sections.length<5)m.sections.push('');
  if(!Array.isArray(m.shorts))m.shorts=[];
  m.shorts=m.shorts.map(s=>{const x=Object.assign(blankShort(),s||{});x.sectionIdx=Number.isInteger(+x.sectionIdx)?+x.sectionIdx:-1;return x;});
  // Scripting 2.0: section outline metadata runs parallel to the existing sections text
  if(!Array.isArray(m.secMeta))m.secMeta=[];
  while(m.secMeta.length<m.sections.length)m.secMeta.push(blankSec());
  // Sections saved before numbered points existed are built from their old talking points and Visual / B-roll text, which stay in place untouched
  m.secMeta=m.secMeta.map((s,i)=>{const x=Object.assign({title:'',visual:''},s||{});x.title=String(x.title==null?'':x.title);
    x.blocks=Array.isArray(x.blocks)?cleanBlocks(x.blocks):sectionBlocks(m.sections[i],x.visual);return x;});
  if(it.scriptType==null||(m.type==='Reel'&&!SCRIPT_TYPES[m.scriptType]))m.scriptType=m.type==='Reel'?inferScriptType(m):'';
  // Caption system: older items get a caption style that follows their script type
  if(it.captionStyle==null||!CAPTION_STYLES[m.captionStyle])m.captionStyle=m.type==='Reel'?captionStyleFor(m):'';
  // An item keeps its hashtag group even if the client's wording no longer has it. Only a blank one gets the default.
  if(typeof m.hashtagGroup!=='string'||!m.hashtagGroup.trim())m.hashtagGroup=defHashGroup();
  if(!Array.isArray(m.platforms))m.platforms=defaultPlatforms(m.type);
  // Monthly carryover: older items start with no history, no parked stage and not archived
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  m.originalPlannedMonth=isMonthKey(it.originalPlannedMonth)?it.originalPlannedMonth:'';
  m.carryHistory=(Array.isArray(it.carryHistory)?it.carryHistory:[]).filter(isObj).map(h=>({from:isMonthKey(h.from)?h.from:'',to:isMonthKey(h.to)?h.to:'',at:String(h.at||''),kind:h.kind==='backlog'?'backlog':'move',dates:isObj(h.dates)?h.dates:{}}));

  m.archived=!!it.archived;m.archivedAt=String(it.archivedAt||'');
  return m;
}

function makeClient(name,about,data){
  const id=newCid();
  return {id:id,name:String(name||'').trim()||'Untitled client',about:String(about==null?'':about),archived:false,created:Date.now(),data:stampClient(data,id)};

function seedRoot(){const c=makeClient('Benchmark Decks',DECK_ABOUT,seed());return {v:3,activeClientId:c.id,theme:'auto',clients:[c]};}
/* Saved before client profiles: the whole thing becomes the first client, named from its company setting */
function rootFromFlat(o,theme){
  const os=o.settings||{};
  const c=makeClient(os.company||'Benchmark Decks',DECK_ABOUT,fixState(o,{legacy:true}));
  return {v:3,activeClientId:c.id,theme:theme||(['auto','light','dark'].includes(os.theme)?os.theme:'auto'),clients:[c]};
}
/* One client from an exported client file. Always gets a fresh id. */
function clientFromFile(cf){
  if(!cf||typeof cf!=='object'||!cf.data||!Array.isArray(cf.data.items))throw new Error('bad client');
  const id=newCid();
  return {id:id,name:String(cf.name||'').trim()||'Imported client',about:String(cf.about==null?'':cf.about),archived:!!cf.archived,created:+cf.created||Date.now(),data:stampClient(fixState(cf.data),id)};
}
/* Any client that cannot be read fails the whole load, so saving never drops a client silently */
function fixRoot(o){
  if(!o||!Array.isArray(o.clients)||!o.clients.length)throw new Error('no clients');
  const seen={};
  const clients=o.clients.map(c=>{
    if(!c||typeof c!=='object'||!c.data||!Array.isArray(c.data.items))throw new Error('bad client');
    let id=String(c.id||'');if(!id||seen[id])id=newCid();seen[id]=1;
    return {id:id,name:String(c.name||'').trim()||'Untitled client',about:String(c.about==null?'':c.about),archived:!!c.archived,created:+c.created||Date.now(),data:stampClient(fixState(c.data),id)};
  });
  let act=clients.find(c=>c.id===o.activeClientId&&!c.archived)||clients.find(c=>!c.archived);
  if(!act){act=clients[0];act.archived=false;}
  return {v:3,activeClientId:act.id,theme:['auto','light','dark'].includes(o.theme)?o.theme:'auto',clients:clients};
}
function storageOk(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
function safetyCopies(o,raw){
  const keep=k=>{try{if(!localStorage.getItem(LS_KEY+k))localStorage.setItem(LS_KEY+k,raw);}catch(e){}};
  // First load after numbered talking points arrived: keep an untouched copy of what was saved before anything is converted
  if(o.items.some(i=>i&&!Array.isArray(i.blocks)))keep('.beforeBlocks');
  // First load after performance snapshots arrived: same safety copy before old results are copied into a snapshot
  if(!o.perfV2&&o.items.some(legacyPerfHas))keep('.beforeSnapshots');
  if(o.items.some(i=>i&&Array.isArray(i.secMeta)&&i.secMeta.some(x=>x&&!Array.isArray(x.blocks))))keep('.beforeSections');
  // First load after language packs arrived: keep an untouched copy before any client is given the deck wording
  if(!o.pack||typeof o.pack!=='object')keep('.beforePacks');
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){return null;}
  if(!raw)return null;
  try{const o=JSON.parse(raw);
    if(o&&Array.isArray(o.clients)){
      o.clients.forEach(c=>{if(c&&c.data&&Array.isArray(c.data.items))safetyCopies(c.data,raw);});
      return fixRoot(o);
    }
    if(o&&Array.isArray(o.items)){
      // First load after client profiles arrived: keep an untouched copy before the data becomes the first client
      try{if(!localStorage.getItem(LS_KEY+'.beforeClients'))localStorage.setItem(LS_KEY+'.beforeClients',raw);}catch(e){}
      safetyCopies(o,raw);
      return rootFromFlat(o);
    }
  }catch(e){console.error('Content HQ: saved content could not be loaded',e);}
  // Saved content exists but could not be read. Leave it untouched, keep a recovery copy, and turn saving off for this session.
  loadFailed=true;
  try{localStorage.setItem(LS_KEY+'.recovery',raw);}catch(e){}
  return null;
}
/* One workspace. legacy = data saved before client profiles: it keeps the deck hashtag defaults and its own example flags.
   Workspaces saved since never get deck defaults or examples merged in.
   Language packs: a workspace saved before packs (Benchmark, any other existing client, an old backup or client file) gets a
   copy of the deck wording with the hashtags it already had, so nothing visibly changes until a new pack is chosen. */
function fixState(o,opt){
  const legacy=!!(opt&&opt.legacy), isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const st=Object.assign({v:1,projects:[],roadmapThemes:{},plan:{},jobsite:{project:'',checks:{}}},o);
  if(legacy)st.deckStarter=true;else{if(st.examplesV2==null)st.examplesV2=true;if(st.examplesCap==null)st.examplesCap=true;}
  st.deckStarter=!!st.deckStarter;
  if(!Array.isArray(st.projects))st.projects=[];
  const os=isObj(o.settings)?o.settings:{};
  // The client name lives on the client and the theme is global, so neither stays in the workspace
  st.settings=Object.assign({reelTarget:6,longTarget:2},os);delete st.settings.company;delete st.settings.theme;
  st.settings.offsets=Object.assign({film:7,edit:2,script:3,plan:3},os.offsets||{});
  // Hashtags now live in the pack. A saved settings.hashtags is kept exactly as it was, and only read to build the first pack.
  const oldTags=Object.assign({},legacy?HASHTAG_GROUPS:emptyTags(),isObj(os.hashtags)?os.hashtags:{});
  if(legacy||isObj(os.hashtags))st.settings.hashtags=oldTags;else delete st.settings.hashtags;
  if(st.settings.website==null)st.settings.website='';if(st.settings.quoteUrl==null)st.settings.quoteUrl='';
  st.pack=isObj(o.pack)?cleanPack(o.pack).pack:deckPack(oldTags);
  st.packPrev=isObj(o.packPrev)?cleanPack(o.packPrev).pack:null;
  st.packPrevChecks=st.packPrev&&isObj(o.packPrevChecks)?o.packPrevChecks:null;
  if(!isObj(st.jobsite))st.jobsite={project:'',checks:{}};
  if(!isObj(st.jobsite.checks))st.jobsite.checks={};
  // Items are read with this workspace's own wording, never the active client's
  return withPack(st.pack,()=>fixItems(st,o));
}
function fixItems(st,o){
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  st.items=o.items.map(normalize);
  // Home tasks and performance snapshots live beside the videos, never inside them
  st.tasks=(Array.isArray(o.tasks)?o.tasks:[]).filter(isObj).map(normTask);
  st.taskDone=isObj(o.taskDone)?o.taskDone:{};
  st.perfSnapshots=(Array.isArray(o.perfSnapshots)?o.perfSnapshots:[]).filter(isObj).map(normSnap);
  st.metricSkips=isObj(o.metricSkips)?o.metricSkips:{};
  if(!st.perfV2){migratePerf(st);st.perfV2=true;}
  if(!st.examplesV2){applyExamples(st);st.examplesV2=true;}
  if(!st.examplesCap){applyCaptionExamples(st);st.examplesCap=true;}
  return st;
}

}

/* ================= monthly carryover =================
   A video planned for an earlier month that is not posted (and not archived) waits in Carryover until it is moved,
   rescheduled, parked in the Idea Bank or archived. Nothing changes on its own when the month turns over.
   Carryover only ever touches the planned month and dates. Script, shots, captions and results are never reset. */
const curMonth=()=>mk(today());
const DATE_DONE={planDate:1,scriptDate:2,filmDate:4,editDate:5,publishDate:7}; // a date stops mattering once the pipeline is past it
const DATE_FIELDS=Object.keys(DATE_DONE);
// Ideas are not active work yet: one left in a month that has passed simply goes back to the Idea Bank (see viewIdeas)
const isCarry=i=>{const m=monthOf(i);return !i.archived&&i.status!=='Posted'&&i.status!=='Idea'&&!!m&&m<curMonth();};
const inIdeaBank=i=>!i.archived&&i.status==='Idea'&&(!i.roadmap||!monthOf(i)||monthOf(i)<curMonth());
const carryList=()=>S.items.filter(isCarry).sort((a,b)=>monthOf(a).localeCompare(monthOf(b))||byPub(a,b));
const wasCarried=i=>!!i.originalPlannedMonth&&monthOf(i)>i.originalPlannedMonth;
const missedPub=i=>!i.archived&&i.status!=='Posted'&&!!i.publishDate&&i.publishDate<today();
const carryMonthName=k=>k.slice(0,4)===curMonth().slice(0,4)?monthName(k):monthLabel(k);
const carryBadge=i=>wasCarried(i)?'<span class="cbadge" title="Originally planned for '+esc(monthLabel(i.originalPlannedMonth))+'">Carryover</span>':'';
function snapDates(it){const o={};DATE_FIELDS.forEach(f=>{if(it[f])o[f]=it[f];});return o;}
function logCarry(it,from,to,kind,dates){
  if(!it.originalPlannedMonth&&from)it.originalPlannedMonth=from;
  it.carryHistory.push({from:from||'',to:to||'',at:today(),kind:kind||'move',dates:dates||{}});
}
// Any other place the planned month moves forward out of a month that has already passed counts as a carryover too
function noteMonthChange(it,from){
  const to=monthOf(it);if(!isMonthKey(to)||to<'2000')return; // ignore half-typed dates
  if(to&&!from&&!it.archived&&(it.carryHistory[it.carryHistory.length-1]||{}).kind==='backlog')logCarry(it,'',to,'move');
  else if(from&&to&&from<to&&from<curMonth()&&it.status!=='Posted'&&it.status!=='Idea'&&!it.archived)logCarry(it,from,to,'move');
}
// Past dates for steps that are not done yet would only keep producing overdue tasks, so they are cleared (and kept in the history entry)
function clearStale(it){const t=today(),x=stIdx(it.status);DATE_FIELDS.forEach(f=>{if(it[f]&&it[f]<t&&x<DATE_DONE[f])it[f]='';});}
// Fill only blank dates from the publish date, and only for steps that are still ahead
function fillBlankDates(it){
  const was=snapDates(it),x=stIdx(it.status);autoDates(it,S.settings);
  DATE_FIELDS.forEach(f=>{if(was[f])it[f]=was[f];else if(x>=DATE_DONE[f])it[f]='';});
}
function carryMove(it,key){
  const from=monthOf(it),before=snapDates(it);
  clearStale(it);it.plannedMonth=key;
  if(from&&from<key)logCarry(it,from,key,'move',before);
}
function carryBacklog(it){
  const from=monthOf(it),before=snapDates(it);
  if(from)logCarry(it,from,'','backlog',before);
  if(it.status!=='Idea'){it.backlogFrom=it.status;it.status='Idea';}
  it.plannedMonth='';DATE_FIELDS.forEach(f=>{it[f]='';});
}
// Taking a parked video out of the Idea Bank puts it back at the stage it was parked at
function unpark(it){const s=it.backlogFrom;it.backlogFrom='';return s&&STATUSES.includes(s)?s:'Scripting';}
function carryPath(it){
  if(!it.originalPlannedMonth)return [];
  const out=[it.originalPlannedMonth];
  it.carryHistory.forEach(h=>{const k=h.kind==='backlog'?'backlog':h.to;if(k&&out[out.length-1]!==k)out.push(k);});
  return out.map(k=>k==='backlog'?'Idea Bank':monthLabel(k));
}

  film:{verb:'Film',kind:'film',icon:'camera',label:'Film',tab:'shoot',field:'filmDate',doneAt:4,next:['Ready to Film','Filming'],to:'Editing'},

};

const GEN_ORDER=['script','film','edit','pub'];
const TASK_CATS=[['general','General'],['planning','Planning'],['filming','Filming'],['editing','Editing'],['publishing','Publishing']];
const CAT_LABEL={general:'General',planning:'Planning',filming:'Filming',editing:'Editing',publishing:'Publishing'};

function normTask(t){
  return {id:String(t.id||uid()),clientId:String(t.clientId||activeId()),title:String(t.title==null?'':t.title),dueDate:/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')?t.dueDate:'',

const genKey=(id,type,date)=>'g|'+id+'|'+type+'|'+date;
function genTasks(){
  const out=[];
  S.items.forEach(it=>{
    if(it.archived)return;
    const x=stIdx(it.status);
    GEN_ORDER.forEach(type=>{
      const g=GEN[type], date=it[g.field];if(!date)return;
      const key=genKey(it.id,type,date), auto=x>=g.doneAt, L=it.type==='Long Form';
      const tk={key:key,src:'gen',type:type,it:it,date:date,auto:auto,done:auto||!!S.taskDone[key],tab:g.tab,kind:g.kind,icon:g.icon,label:g.label,
        title:g.verb+(type==='pub'?(L?' Long Form':' Reel'):'')+' — '+title(it),sub:''};
      if(type==='pub'){tk.kind=L?'long':'reel';tk.icon=L?'play':'phone';tk.label=L?'Long-form publish':'Reel publish';tk.sub=platText(it);}
      if(type==='film'){const p=shotProg(it);tk.sub=p.n?(p.n-p.cap?(p.n-p.cap)+' of '+p.n+' shots remaining':'All '+p.n+' shots captured'):'No shot list yet';}
      if(type==='edit'){const p=shotProg(it);if(p.n)tk.sub=p.used+' of '+p.n+' shots used in edit';}
      if(type==='script'&&it.type==='Reel'){const m=scriptMissing(it);tk.sub=m.length?'Still needed: '+m.join(', ').toLowerCase():'Script has everything it needs';}
      if(auto)tk.sub='Already done in the pipeline ('+it.status+')';
      out.push(tk);
    });
  });
  return out;
}

function monthGoal(key){
  const its=itemsIn(key), T=S.settings;
  // Each video counts once, in the month it is planned for now. carry = how many of those were moved in from an earlier month.
  const part=(list,target)=>({posted:list.filter(i=>i.status==='Posted').length,planned:list.filter(i=>i.status!=='Posted').length,carry:list.filter(wasCarried).length,target:target});
  const reels=part(its.filter(i=>i.type!=='Long Form'),T.reelTarget), longs=part(its.filter(i=>i.type==='Long Form'),T.longTarget);
  return {reels:reels,longs:longs,total:{posted:reels.posted+longs.posted,planned:reels.planned+longs.planned,carry:reels.carry+longs.carry,target:T.reelTarget+T.longTarget}};
}
function goalBar(label,k,g,segs){
  const tg=Math.max(1,g.target), pc=n=>Math.min(100,n/tg*100);
  let used=0;const seg=(n,cls)=>{const w=Math.min(100-used,pc(n));used+=w;return w>0?'<i class="'+cls+'" style="width:'+w+'%"></i>':'';};
  const bars=(segs||[[g.posted,'on '+(k?'k-'+k:'')]]).map(s=>seg(s[0],s[1])).join('')+seg(g.planned,'pl');
  return '<div class="mp'+(k?' k-'+k:'')+'"><div class="mp-top"><span class="mp-l">'+label+'</span><span class="mp-n"><b>'+g.posted+'</b> / '+g.target+'</span></div>'
   +'<div class="mp-bar" role="img" aria-label="'+g.posted+' of '+g.target+' published'+(g.planned?', '+g.planned+' more planned':'')+'">'+bars+'</div>'
   +'<div class="mp-s">published'+(g.planned?' · '+g.planned+' more planned this month':'')+(g.posted>=g.target&&g.target?' · goal met ✓':'')+'</div>'
   +(g.carry?'<div class="mp-c">'+(g.posted+g.planned)+' / '+g.target+' planned · '+(g.posted+g.planned-g.carry)+' new · '+g.carry+' carryover</div>':'')+'</div>';
}
/* Chart 1: how much went out each month, Reels vs long form */
function chartPublished(){
  const cur=mk(today()), months=[];for(let i=5;i>=0;i--)months.push(addMonths(cur,-i));
  const posted=S.items.filter(i=>i.status==='Posted'), pm=i=>mk(i.publishedDate||i.publishDate);
  const rows=months.map(k=>({k:k,r:posted.filter(i=>pm(i)===k&&i.type!=='Long Form').length,l:posted.filter(i=>pm(i)===k&&i.type==='Long Form').length}));
  if(!rows.some(r=>r.r||r.l))return empty('Nothing has been marked posted in the last six months yet. Once videos go live, this shows whether you are publishing steadily.');
  const max=Math.max(1,...rows.map(r=>Math.max(r.r,r.l)));
  const b=(n,k,lab,mon)=>'<span class="hc-bar k-'+k+'" style="height:'+(n?Math.max(4,n/max*100):0)+'%" title="'+esc(mon+': '+n+' '+lab)+'">'+(n?'<em>'+n+'</em>':'')+'</span>';
  return '<div class="hc-leg"><span class="k-reel"><i></i>Reels</span><span class="k-long"><i></i>Long form</span><span class="muted sm">Target '+S.settings.reelTarget+' + '+S.settings.longTarget+' a month</span></div>'
   +'<div class="hc" role="img" aria-label="Videos published per month, last six months">'+rows.map(r=>{const mon=monthLabel(r.k);return '<div class="hc-m'+(r.k===cur?' cur':'')+'"><div class="hc-bars">'+b(r.r,'reel','Reels',mon)+b(r.l,'long','long-form',mon)+'</div><span class="hc-l">'+MON3[+r.k.slice(5,7)-1]+'</span></div>';}).join('')+'</div>'
   +'<table class="sr"><caption>Videos published per month</caption><tr><th>Month</th><th>Reels</th><th>Long form</th></tr>'+rows.map(r=>'<tr><td>'+monthLabel(r.k)+'</td><td>'+r.r+'</td><td>'+r.l+'</td></tr>').join('')+'</table>';
}
/* Chart 2: average views per video by content pillar, only once there is enough real data */
function pillarRows(items){
  const withV=items.filter(i=>vt(i,'views')!=null), g=group(withV,i=>i.pillar);
  return Object.keys(g).map(k=>({l:k,v:g[k].reduce((t,i)=>t+vt(i,'views'),0)/g[k].length,n:g[k].length})).sort((a,b)=>b.v-a.v);
}
function chartPillars(){
  const rows=pillarRows(S.items.filter(i=>i.status==='Posted')), n=rows.reduce((t,r)=>t+r.n,0);
  if(rows.length<2||n<3)return empty('Not enough results yet. Once at least three posted videos in two or more pillars have views entered, this compares pillars.'+(n?' ('+n+' so far.)':''));
  return bars(rows.map(r=>({l:r.l+' ('+r.n+')',v:r.v})))+'<p class="muted sm chart-note">Average views per video, using each video\'s latest snapshot on each platform.</p>';
}
function insights(){
  const posted=S.items.filter(i=>i.status==='Posted'&&vt(i,'views')!=null), cur=mk(today()), out=[];
  const thisM=posted.filter(i=>mk(i.publishedDate||i.publishDate)===cur).sort((a,b)=>vt(b,'views')-vt(a,'views'));
  if(thisM.length)out.push(['Top video this month',title(thisM[0]),nf(vt(thisM[0],'views'))+' views',thisM[0].id]);
  const pr=pillarRows(posted).filter(r=>r.n>=2);
  if(pr.length>=2)out.push(['Top content pillar',pr[0].l,nf(pr[0].v)+' avg views across '+pr[0].n+' videos']);
  const pl=platformRows(posted).filter(r=>r.n>=2);
  if(pl.length>=2)out.push(['Best platform',pl[0].l,nf(pl[0].v)+' avg views across '+pl[0].n+' videos']);
  if(!out.length)return '';
  return '<div class="ins">'+out.map(x=>'<div>'+(x[3]?'<button class="link-b" data-act="edit" data-id="'+x[3]+'" data-tab="publish">':'')+'<span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small>'+(x[3]?'</button>':'')+'</div>').join('')+'</div>';
}

/* ================= calendar ================= */
const EV_LABEL={film:'Filming',edit:'Edit due',script:'Script due',plan:'Planning day',reel:'Reel',long:'Long form'};
const EV_LEGEND={reel:'Reel publish',long:'Long-form publish',film:'Filming day',edit:'Editing deadline',script:'Script deadline',plan:'Planning day'};
const EV_ICON={reel:'phone',long:'play',film:'camera',edit:'scissors',script:'pen',plan:'flag'};
const calKinds=mode=>['reel','long','film','edit'].concat(mode==='prod'?['script','plan']:[]);
function eventsFor(mode){
  const ev={};
  const add=(d,e)=>{if(d)(ev[d]=ev[d]||[]).push(e);};
  S.items.forEach(it=>{
    if(it.archived)return;
    const x=stIdx(it.status);
    add(it.publishDate,{k:it.type==='Long Form'?'long':'reel',it:it,done:x===7});
    add(it.filmDate,{k:'film',it:it,done:x>=4});
    add(it.editDate,{k:'edit',it:it,done:x>=5});
    if(mode==='prod'){add(it.scriptDate,{k:'script',it:it,done:x>=2});add(it.planDate,{k:'plan',it:it,done:x>=1});}
  });
  return ev;
}
/* one chip per publish; filming, editing, script and planning are grouped per day */
function dayChips(evs){
  const out=[];
  evs.filter(e=>e.k==='reel'||e.k==='long').forEach(e=>out.push({k:e.k,done:e.done,items:[e.it]}));
  ['film','edit','script','plan'].forEach(k=>{
    const g=evs.filter(e=>e.k===k);
    if(g.length)out.push({k:k,done:g.every(e=>e.done),items:g.map(e=>e.it)});
  });
  return out;
}
function calDays(key){
  const first=pd(key+'-01'), lead=(first.getDay()+6)%7, daysIn=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const n=Math.ceil((lead+daysIn)/7)*7, out=[];
  for(let i=0;i<n;i++)out.push(ds(new Date(first.getFullYear(),first.getMonth(),1-lead+i)));
  return out;
}
function chipHtml(c){
  const pub=c.k==='reel'||c.k==='long', one=c.items.length===1;
  const txt=pub?esc(title(c.items[0])):'<b>'+EV_LABEL[c.k]+'</b> · '+(one?esc(title(c.items[0])):c.items.length+' videos');
  const tip=esc(EV_LEGEND[c.k]+': '+c.items.map(title).join(', ')+(c.done?' (done)':''));
  const cls='cchip '+c.k+(c.done?' done':''), inner=I(EV_ICON[c.k])+'<span class="ct">'+txt+'</span>';
  return one?'<button class="'+cls+'" data-act="calChip" data-id="'+c.items[0].id+'" title="'+tip+'">'+inner+'</button>':'<span class="'+cls+'" title="'+tip+'">'+inner+'</span>';
}
const fmtFull=s=>fmtW(s)+', '+s.slice(0,4);
function viewCalendar(){
  const key=ui.calMonth, t=today(), ev=eventsFor(ui.calMode), kinds=calKinds(ui.calMode);
  const sel=mk(ui.calDay)===key?ui.calDay:(mk(t)===key?t:'');
  const count={};let cells='', agenda='';
  calDays(key).forEach(s=>{
    const out=mk(s)!==key, day=+s.slice(8), chips=dayChips(ev[s]||[]);
    if(!out&&chips.length){
      chips.forEach(c=>{count[c.k]=(count[c.k]||0)+(c.k==='film'||c.k==='plan'?1:c.items.length);});
      agenda+='<section class="ag-day"><button data-act="day" data-date="'+s+'">'+esc(fmtW(s))+'</button><div class="cchips">'+chips.map(chipHtml).join('')+'</div></section>';
