<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content HQ · Deck content planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F2A28'/%3E%3Crect x='16' y='22' width='16' height='56' rx='3' fill='%23B8742E'/%3E%3Crect x='42' y='22' width='16' height='56' rx='3' fill='%232F6B5B'/%3E%3Crect x='68' y='22' width='16' height='56' rx='3' fill='%23D9DED6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEEA;--surface:#FFFFFF;--surface2:#F5F7F4;--line:#D9DED6;--line2:#C7CEC4;
  --ink:#1C2422;--ink2:#4B5752;--ink3:#76827C;
  --side:#1F2A28;--side2:#2A3734;--sideInk:#DCE3DE;--sideInk2:#95A39D;
  --cedar:#B8742E;--cedarD:#9A5F22;--cedarL:#F3E4D2;
  --green:#2F6B5B;--greenD:#245446;--greenL:#DCEBE5;
  --slate:#4F6D86;--slateL:#E0E8EF;
  --red:#B4483A;--redL:#F6E1DD;--amber:#C99A2E;--amberL:#F6ECD2;
  --shadow:0 1px 2px rgba(28,36,34,.06),0 4px 14px rgba(28,36,34,.05);
  --r1:6px;--r2:10px;--r3:16px;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131917;--surface:#1B2320;--surface2:#212B28;--line:#2E3935;--line2:#3B4843;
    --ink:#E6ECE8;--ink2:#B4C0BA;--ink3:#84928B;
    --side:#0F1413;--side2:#1B2320;
    --cedar:#D08A45;--cedarD:#E29C57;--cedarL:#3A2B1C;
    --green:#56A38C;--greenD:#6DB8A1;--greenL:#1D3530;
    --slate:#7F9DB6;--slateL:#1F2B36;--red:#D9695A;--redL:#3A1F1B;--amber:#D9AE4A;--amberL:#3A311A;
    --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131917;--surface:#1B2320;--surface2:#212B28;--line:#2E3935;--line2:#3B4843;
  --ink:#E6ECE8;--ink2:#B4C0BA;--ink3:#84928B;
  --side:#0F1413;--side2:#1B2320;
  --cedar:#D08A45;--cedarD:#E29C57;--cedarL:#3A2B1C;
  --green:#56A38C;--greenD:#6DB8A1;--greenL:#1D3530;
  --slate:#7F9DB6;--slateL:#1F2B36;--red:#D9695A;--redL:#3A1F1B;--amber:#D9AE4A;--amberL:#3A311A;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
body.drawer-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:18px;height:18px;flex:none}
.ic.xs{width:13px;height:13px;vertical-align:-2px}
:focus-visible{outline:2px solid var(--cedar);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:600}
h1{font:600 34px/1.05 var(--fd);letter-spacing:.2px}
h2{font:600 20px/1.2 var(--fd);letter-spacing:.2px}
h3{font-size:16px}
h4{font-size:14px}
.muted{color:var(--ink3)}.sm{font-size:13px}.pad{padding:14px 18px}
.grow{flex:1}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-mark{display:flex;gap:3px;width:30px;height:30px;padding:5px;background:var(--side2);border-radius:8px}
.brand-mark i{flex:1;border-radius:2px;background:var(--cedar)}
.brand-mark i:nth-child(2){background:var(--green)}.brand-mark i:nth-child(3){background:#D9DED6}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font:600 21px var(--fd);letter-spacing:.3px}
.brand-text small{color:var(--sideInk2);font-size:12px}
#nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--sideInk2);font-size:14px;font-weight:500;position:relative}
.nav-i:hover{background:var(--side2);color:var(--sideInk)}
.nav-i.on{background:var(--side2);color:#fff}
.nav-i.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--cedar)}
.nav-i em{margin-left:auto;font-style:normal;font-size:12px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:10px;color:var(--sideInk)}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.store-note{font-size:12px;color:var(--sideInk2);margin:10px 4px 0}
.store-note.warn{color:#F2B8A8}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:12px;align-items:center;padding:14px 28px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;color:var(--ink3)}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%;color:var(--ink)}
.search:focus-within{border-color:var(--cedar)}
#addwrap{margin-left:auto;position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 12px 30px rgba(0,0,0,.14);padding:6px;min-width:220px;z-index:30}
.menu.open{display:block}
.menu button{display:block;width:100%;padding:9px 12px;border-radius:7px;font-weight:500}
.menu button:hover{background:var(--surface2)}
#main{outline:none}
.page{padding:26px 28px 60px;max-width:1280px}
.page.wide{max-width:none}.page.narrow{max-width:820px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .12s,border-color .12s}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn.accent{background:var(--cedar);color:#fff}.btn.accent:hover{background:var(--cedarD)}
.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--greenD)}
.btn.ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}.btn.ghost:hover{border-color:var(--ink3)}
.btn.ghost-light{border-color:rgba(255,255,255,.18);color:var(--sideInk)}.btn.ghost-light:hover{background:var(--side2)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger.ghost{background:none;color:var(--red);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.file{position:relative}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--ink2)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.sm{width:26px;height:26px}.icon-btn.sm .ic{width:15px;height:15px}
.link,.link-b{color:var(--green);font-weight:600;font-size:13px}
.link-b{font-size:inherit;text-align:left}
.link:hover,.link-b:hover{text-decoration:underline}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}

/* ---------- page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sub{margin:6px 0 0;color:var(--ink2)}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--ink2)}
.mnav span{min-width:120px;text-align:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg.wrap{flex-wrap:wrap;margin-bottom:18px}
.seg button{padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
label.inline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin-top:6px}
.card-b{padding:16px 18px}
.count{font-size:12px;font-weight:600;color:var(--ink3);background:var(--surface2);border:1px solid var(--line);padding:1px 8px;border-radius:10px;font-family:var(--fb)}
.empty{padding:28px 20px;text-align:center;color:var(--ink3)}
.empty p{margin:0 0 12px;max-width:440px;margin-inline:auto}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cols2.even{grid-template-columns:1fr 1fr}
.cols2.plan{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}

/* ---------- dashboard hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:22px 24px 20px;margin-bottom:18px}
.hero-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero-h .mnav{margin-left:-8px;margin-bottom:4px}
.hero h1{font-size:44px}
.boards{display:flex;flex-direction:column;gap:5px;margin-bottom:20px;padding:10px;background:repeating-linear-gradient(90deg,var(--surface2) 0 1px,transparent 1px 120px),var(--surface2);border-radius:var(--r2);border:1px solid var(--line)}
.plank{--c:var(--cedar);--cl:var(--cedarL);position:relative;display:flex;align-items:center;min-height:42px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.plank.long{--c:var(--green);--cl:var(--greenL);min-height:52px}
.plank .meter{position:absolute;inset:0;pointer-events:none}
.plank .meter i{position:absolute;left:0;top:0;bottom:0;width:var(--fill);background:var(--cl);transition:width .4s ease}
.plank::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);z-index:1}
.plank.done .meter i{background:var(--c);opacity:.22}
.plank:hover{border-color:var(--c)}
.pl-body{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:0 14px 0 18px}
.pl-date{font:600 15px var(--fd);color:var(--ink2);letter-spacing:.3px}
.pl-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plank.long .pl-title{font-size:16px}
.pl-status{font-size:12px;font-weight:600;color:var(--c)}
.plank.empty{background:transparent;border-style:dashed;border-color:var(--line2)}
.plank.empty::before{opacity:.35}
.plank.empty .pl-title{color:var(--ink3);font-weight:500}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{padding:4px 2px}
.pc-top{display:flex;justify-content:space-between;align-items:baseline}
.pc-l{font-weight:600;color:var(--ink2);font-size:14px}
.pc-n{font:500 16px var(--fd);color:var(--ink3)}.pc-n b{font-size:26px;color:var(--ink);font-weight:600}
.pbar{height:8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;margin:6px 0}
.pbar i{display:block;height:100%}
.pbar .p1{background:var(--green)}.pbar .p2{background:var(--cedar);opacity:.6}
.pc-s{font-size:12px;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr) 1.4fr 1.4fr;gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--line2)}
.tn{font:600 30px/1 var(--fd)}.tn.sm{font-size:20px;line-height:1.2}
.tl{font-size:12.5px;color:var(--ink3);font-weight:500}
.rail .card-h{padding:12px 16px}
.mini{list-style:none;margin:0;padding:6px}
.mini li button{display:flex;flex-direction:column;width:100%;padding:8px 10px;border-radius:7px}
.mini li button:hover{background:var(--surface2)}
.mini li b{font-weight:600;font-size:14px;line-height:1.3}
.mini li span{font-size:12.5px;color:var(--ink3)}
.mini li.split{display:flex;align-items:center}
.mini li.split button:first-child{flex:1}
.mini li.split .icon-btn{width:32px;flex:none;display:grid}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.clickable tbody tr{cursor:pointer}
.tbl.clickable tbody tr:hover td{background:var(--surface2)}
.tbl .t{font-weight:600;min-width:200px}
.tbl .nw{white-space:nowrap}.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.late td:first-child{color:var(--red)}
.late-tag{font-size:11px;font-weight:600;background:var(--redL);color:var(--red);padding:1px 6px;border-radius:5px}
.tbl.perf td{padding:6px 8px}
.cellin{width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.cellin:focus{border-color:var(--cedar);outline:none;background:var(--surface)}
.star{color:var(--amber);margin-right:6px}.star .ic{width:14px;height:14px;fill:currentColor;vertical-align:-2px}
.star-btn.on{color:var(--amber)}.star-btn.on .ic{fill:currentColor}

/* ---------- pills, tags, chips ---------- */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pill.st1{background:var(--slateL);color:var(--slate);border-color:transparent}
.pill.st2{background:var(--amberL);color:var(--amber);border-color:transparent}
.pill.st3{background:var(--cedarL);color:var(--cedarD);border-color:transparent}
.pill.st4{background:var(--cedarL);color:var(--cedarD);border-color:transparent}
.pill.st5,.pill.st6{background:var(--greenL);color:var(--greenD);border-color:transparent}
.pill.st7{background:var(--green);color:#fff;border-color:transparent}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.2px}
.tag.reel{background:var(--cedarL);color:var(--cedarD)}
.tag.long{background:var(--greenL);color:var(--greenD)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;align-items:center}
.chip{display:inline-block;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-weight:500}
button.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.sm{font-size:12px;padding:1px 8px;border-color:var(--line)}
.chip.soft{background:var(--surface2)}
.sumline{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;font-size:14px}

/* ---------- calendar ---------- */
.cal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-left:auto;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.reel{background:var(--cedar)}.dot.long{background:var(--green)}.dot.film{background:var(--slate)}.dot.edit{background:var(--amber)}.dot.script{background:var(--ink3)}.dot.plan{background:var(--line2)}
.cal-scroll{overflow-x:auto}
.cal{min-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--line)}
.cal-dow span{padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(118px,auto)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface2)}
.cell.out{background:var(--surface2)}.cell.out .dnum{color:var(--ink3);opacity:.6}
.dnum{font:600 15px var(--fd);color:var(--ink2);padding:0 3px}
.cell.today .dnum{background:var(--cedar);color:#fff;border-radius:5px;align-self:flex-start;padding:0 7px}
.cchip{display:block;font-size:12px;line-height:1.3;padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;border-left:3px solid;width:100%}
.cchip.reel{background:var(--cedarL);border-color:var(--cedar);color:var(--ink)}
.cchip.long{background:var(--greenL);border-color:var(--green);color:var(--ink);font-weight:600}
.cchip.film{background:var(--slateL);border-color:var(--slate);color:var(--ink2)}
.cchip.edit{background:var(--amberL);border-color:var(--amber);color:var(--ink2)}
.cchip.script,.cchip.plan{background:var(--surface2);border-color:var(--ink3);color:var(--ink2)}
.cchip.done{opacity:.5;text-decoration:line-through}
.more{font-size:12px;color:var(--ink3);padding:0 4px}
.daylist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.daylist li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.daylist .cchip{width:auto}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;max-height:calc(100vh - 210px);transition:border-color .12s,background .12s}
.kcol.over{border-color:var(--cedar);background:var(--cedarL)}
.kcol-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px}
.kcol-h h3{font:600 17px var(--fd);letter-spacing:.3px}
.kcol-b{padding:4px 8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kempty{font-size:13px;color:var(--ink3);text-align:center;border:1px dashed var(--line2);border-radius:8px;padding:16px;margin:0}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cedar);border-radius:8px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.kcard.is-long{border-left-color:var(--green)}
.kcard:hover{border-color:var(--line2)}
.kcard.dragging{opacity:.45}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.kc-date{font-size:12px;color:var(--ink3);font-weight:500}
.kcard h4{font-size:14px;line-height:1.3;margin-bottom:6px}
.kc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.kc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}

/* ---------- idea bank ---------- */
.qa{padding:12px}
.qa-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qa-row input,.qa-row select{padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
.qa-row label.grow input{width:100%}
.qa-row label.grow{min-width:240px}
.grp{margin-bottom:24px}
.grp h2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;justify-content:space-between;padding:4px 4px 12px}
.idea:hover{border-color:var(--line2)}
.idea>.btn{margin:0 12px;align-self:flex-start}
.idea-main{display:grid;grid-template-columns:10px 1fr;gap:4px 10px;padding:10px 10px 10px 12px;align-items:start}
.prio{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line2)}
.prio.p-High{background:var(--cedar)}.prio.p-Medium{background:var(--amber)}
.idea-t{font-weight:600;line-height:1.35}
.idea-m{grid-column:2;display:flex;flex-wrap:wrap;gap:5px}
.idea-n{grid-column:2;font-size:13px;color:var(--ink3);line-height:1.4}

/* ---------- this month / lists ---------- */
.mlist{list-style:none;margin:0;padding:4px 0}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow-t{flex:1;display:flex;flex-direction:column;min-width:0}
.mrow-t b{font-weight:600}
.mrow-t span{font-size:12.5px;color:var(--ink3)}
.mrow.done .mrow-t b{text-decoration:line-through;color:var(--ink3)}
.chk{display:inline-flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:14px;line-height:1.35}
.chk input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;flex:none;border:1.5px solid var(--line2);border-radius:5px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin-top:1px}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:disabled{cursor:default}
.chk.sm{font-size:13px;color:var(--ink2);margin-left:6px}
.chk.big{font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);align-items:center}
.chk.big input{width:22px;height:22px}
.chk.big:has(input:checked){background:var(--greenL);border-color:transparent}

/* ---------- need to film ---------- */
.fcard{padding:18px 20px}
.fc-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.fc-h h3{font:600 22px/1.15 var(--fd);margin-top:6px}
.due{font-weight:600;font-size:13px;background:var(--slateL);color:var(--slate);padding:4px 10px;border-radius:6px;white-space:nowrap}
.due.late{background:var(--redL);color:var(--red)}
.fc-s{padding:10px 0;border-top:1px solid var(--line)}
.fc-s h4{font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:6px}
.fc-s p{margin:0}
.pre{white-space:pre-line}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin-bottom:10px}
.fc-f{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
h2.sect{margin:26px 0 12px}

/* ---------- filters, forms ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink3)}
select,input[type=text],input[type=date],input[type=month],input[type=number],input[type=url],input:not([type]),textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0}
textarea{resize:vertical;line-height:1.45;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cedar);box-shadow:0 0 0 3px var(--cedarL)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:12px}
.form-grid.two{grid-template-columns:1fr 1fr}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;padding:0;margin:0 0 4px}
.fld.wide{grid-column:1/-1}
.fld label,.fld legend{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%}
.plats{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px}

/* ---------- performance ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;display:flex;flex-direction:column}
.kpis b{font:600 28px/1.1 var(--fd)}
.kpis span{font-size:12.5px;color:var(--ink3)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 18px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bt{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--green);border-radius:4px}
.bv{text-align:right;font-weight:600}
.colchart{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col i{width:100%;max-width:46px;background:var(--cedar);border-radius:4px 4px 0 0}
.cv{font-size:11.5px;font-weight:600;color:var(--ink2)}
.cl{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 18px}
.dl{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:0 0 14px;font-size:14px}
.dl dt{color:var(--ink3);font-weight:600;font-size:12.5px}
.dl dd{margin:0}

/* ---------- templates ---------- */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.tpl-col h4{font:600 17px var(--fd);margin-bottom:6px}
.tpl-col ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.8}
.tpl-col ul.tpl-check{list-style:none;padding:0}
.tpl-col ul.tpl-check li::before{content:'';display:inline-block;width:12px;height:12px;border:1.5px solid var(--line2);border-radius:3px;margin-right:9px;vertical-align:-1px}
.js-h{font:600 20px var(--fd);margin:20px 0 10px}
.js-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:20px}
.sug-i{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--surface2)}
.sug-i h4{margin-bottom:4px;font-size:14.5px}
.sug-i p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.sug-i .btn{align-self:flex-start}
.pillars{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pillars h4{font:600 18px var(--fd)}
.pillars p{margin:4px 0 0;font-size:13.5px}

/* ---------- plan ---------- */
.steps{list-style:none;padding:0;margin:14px 0 8px;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li em{font-style:normal;font-size:12px;color:var(--ink3);white-space:nowrap}
.steps li.done .chk span{color:var(--ink3)}
.slots{list-style:none;padding:0;margin:12px 0 0}
.slot{display:grid;grid-template-columns:96px 120px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.slot:last-child{border-bottom:0}
.slot-d{font:600 15px var(--fd);color:var(--ink2)}
.slot-k{font-size:12px;font-weight:600}
.slot-k.reel{color:var(--cedarD)}.slot-k.long{color:var(--greenD)}
.slot-c{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot-pick{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.slot-pick select{flex:1;min-width:150px;font-size:13px;padding:6px 8px}
.plan-mini .card-b .btn{margin-top:4px}
.plan-mini p{margin:6px 0}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,19,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(30px);opacity:0;transition:transform .2s ease,opacity .2s ease;outline:none}
.drawer.open{transform:none;opacity:1}
.drawer.still{transition:none}
.dr-h{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
.dr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.dr-top .icon-btn{margin-left:auto}
.dr-title{width:100%;border:0!important;box-shadow:none!important;padding:2px 0!important;font:600 28px/1.15 var(--fd)!important;background:none!important;letter-spacing:.2px}
.dr-tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.dr-tabs button{padding:11px 10px;font-size:13.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.dr-tabs button.on{color:var(--ink);border-bottom-color:var(--cedar)}
.dr-b{flex:1;overflow-y:auto;padding:18px 22px 30px}
.dr-sec{font:600 19px var(--fd);margin:18px 0 10px;letter-spacing:.2px}
.dr-sec:first-child{margin-top:0}
.dr-f{display:flex;gap:8px;align-items:center;padding:12px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.shorts{display:flex;flex-direction:column;gap:10px}
.short{border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px 0;background:var(--surface2)}
.short-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.short-h b{margin-right:auto}

/* ---------- modal, toast ---------- */
.scrim.show{z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r3);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 6px}
.modal-h h3{font:600 22px var(--fd)}
.modal-b{padding:6px 20px 20px}
.modal-b .fld{margin-bottom:12px}
.modal-b p{margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:9px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .tiles{grid-template-columns:repeat(5,1fr)}
  .tile.wide{grid-column:span 5}
  .tiles .tile.wide+.tile.wide{grid-column:span 5}
}
@media (max-width:1024px){
  .cols2,.cols2.plan{grid-template-columns:1fr}
  .tpl{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  #shell{flex-direction:column}
  #side{width:auto;height:auto;position:sticky;top:0;z-index:25;padding:8px 10px;flex-direction:row;align-items:center;gap:8px}
  .brand{padding:0 4px}
  .brand-text small{display:none}
  #nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  .nav-i{white-space:nowrap;padding:8px 10px;font-size:13px}
  .nav-i.on::before{display:none}
  .nav-i .ic{display:none}
  .nav-sep{display:none}
  .side-foot{display:none}
  #top{top:54px;padding:10px 14px}
  .page{padding:18px 14px 50px}
  h1{font-size:28px}.hero h1{font-size:34px}
  .hero{padding:16px}
  .pcards{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile.wide,.tiles .tile.wide+.tile.wide{grid-column:span 3}
  .cols2.even{grid-template-columns:1fr}
  .pl-body{grid-template-columns:60px minmax(0,1fr);gap:4px 10px;padding:6px 10px 6px 14px}
  .pl-status{grid-column:2}
  .form-grid,.form-grid.two,.form-grid.three{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .tpl{grid-template-columns:1fr}
  .slot{grid-template-columns:1fr 1fr}
  .slot-c{grid-column:1/-1}
  .fc-h{flex-direction:column}
  .fc-f .btn{flex:1}
  .shots{grid-template-columns:1fr 1fr}
  .dr-h,.dr-b,.dr-f{padding-left:16px;padding-right:16px}
  .search{max-width:none}
}
@media (max-width:480px){
  .shots{grid-template-columns:1fr}
  .chk.big{font-size:16px;padding:13px 14px}
  #addbtn{padding:9px 12px}
}

/* ---------- Scripting 2.0 ---------- */
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.help{font-size:12px;color:var(--ink3);line-height:1.4}
.sg-card{border:1px solid var(--line);border-radius:var(--r2);padding:16px 16px 14px;background:var(--surface);margin-bottom:14px;border-top:3px solid var(--cedar)}
.flow{font-size:12.5px;color:var(--ink3);margin:-4px 0 14px;font-weight:500}
.flow span{color:var(--cedar);margin:0 3px}
.shots.compact{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;margin:6px 0 4px}
.shots.compact .chk{font-size:13.5px}
.sr-box{margin-top:12px;padding:12px 14px;border-radius:var(--r1);background:var(--surface2);border:1px solid var(--line)}
.sr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sr-badge{font:600 17px var(--fd);letter-spacing:.3px;color:var(--cedarD)}
.sr-badge.ok{color:var(--greenD)}
.sr-miss{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.sr-chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cedarL);color:var(--cedarD)}
.sr-chip.ok{background:var(--greenL);color:var(--greenD)}
.sg-prev{border:1px dashed var(--line2);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px}
.sg-prev-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sg-prev-h h3{font:600 18px var(--fd);letter-spacing:.2px}
.sg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sg li{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line2)}
.sg li.is-hook{border-color:var(--cedar)}.sg li.is-cta{border-color:var(--green)}
.sg-k{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.4px;text-transform:uppercase}
.sg-v{font-size:15px;line-height:1.45}
.sg-vis{font-size:12.5px;color:var(--slate)}
details.adv{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;background:var(--surface)}
details.adv summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);transition:transform .15s}
details.adv[open] summary::before{transform:rotate(45deg)}
.adv-b{padding:4px 14px 6px}
.secs{display:flex;flex-direction:column;gap:10px}
.sec{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;background:var(--surface2)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-n{flex:none;width:26px;height:26px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;font:600 15px var(--fd)}
.sec-h input{flex:1;font-weight:600;font-size:15px;background:var(--surface)}
.sec .form-grid{margin-bottom:6px}
.sec-reel{margin-top:10px;padding:10px 12px;border-radius:var(--r1);background:var(--surface);border:1px solid var(--line)}
.sec-reel p{margin:0;display:flex;gap:8px;align-items:center}
.shorts-box{margin:18px 0 14px;padding:14px 16px;border-radius:var(--r2);background:var(--greenL);border:1px solid transparent}
.shorts-box .short{background:var(--surface)}
.sb-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sb-h h3{font:600 19px var(--fd);letter-spacing:.2px}
.shorts-box>p{margin:4px 0 10px}
.short-h .pill{margin-left:auto}
.short-h b+.muted{margin-left:auto}
.modal.lg{width:min(640px,calc(100vw - 32px))}
.lib-g{margin-bottom:14px}
.lib-g h4{font:600 16px var(--fd);letter-spacing:.3px;margin-bottom:6px;color:var(--ink2)}
.lib-i{display:block;width:100%;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);font-size:14px;line-height:1.4}
.lib-i:hover{border-color:var(--cedar);background:var(--cedarL)}
.cmp p{margin:2px 0 12px;padding:8px 10px;border-radius:var(--r1);background:var(--surface2)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.st-i{border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;background:var(--surface2)}
.st-i h4{font:600 16px var(--fd);letter-spacing:.2px}
.st-i .flow{margin:4px 0 0}
.kc-ready{margin-top:6px;font-size:12px;font-weight:600;color:var(--greenD)}
/* Need to Film, built for a glance at a jobsite */
.fc-h{display:block}
.fc-h h3{margin:0 0 6px}
.fc-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fc-big{font-size:18px;line-height:1.45;font-weight:500}
.fc-hook{border-left:4px solid var(--cedar);padding-left:12px!important;border-top:0!important;margin:10px 0}
.fc-cta{border-left:4px solid var(--green);padding-left:12px!important;border-top:0!important;margin:10px 0}
.fc-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:fp}
.fc-points li{display:flex;flex-direction:column;gap:2px;padding-left:34px;position:relative;counter-increment:fp}
.fc-points li::before{content:counter(fp);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:600 14px var(--fd);color:var(--ink2)}
.fp-k{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase}
.fp-v{font-size:17px;line-height:1.45}
.fcard .shots .chk.big{padding:9px 12px}
@media (max-width:820px){
  .fc-big{font-size:19px}.fp-v{font-size:18px}
  .shots.compact{grid-template-columns:1fr 1fr}
  .sec-h input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

</style>
</head>
<body>
<div id="shell">
  <aside id="side">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>Content HQ</b><small id="brandSub">Deck content planner</small></span>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="btn ghost-light block" data-act="planGo" data-next="1">Plan next month</button>
      <p id="storeNote" class="store-note"></p>
    </div>
  </aside>
  <div id="content">
    <header id="top">
      <label class="search"><span class="sr">Search all content</span>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="search" placeholder="Search all content" autocomplete="off">
      </label>
      <div id="addwrap">

function rhythmDates(key){
  const y=+key.slice(0,4), m=+key.slice(5,7)-1;
  const first=new Date(y,m,1), last=new Date(y,m+1,0).getDate();
  const lastS=key+'-'+pad(last), firstS=key+'-01';
  let mon=1+((8-first.getDay())%7);
  const build=mo=>RHYTHM.map(r=>{const d=new Date(y,m,mo+r.w*7+(r.dow-1));return Object.assign({},r,{date:ds(d)});});
  let out=build(mon);
  if(out[7].date>lastS){mon-=7;out=build(mon);}
  return out.map(r=>Object.assign({},r,{date:r.date<firstS?firstS:(r.date>lastS?lastS:r.date)}));

function normalize(it){

  ['perf','recap','shots','prod'].forEach(k=>{m[k]=Object.assign({},base[k],it[k]||{});});
  if(!Array.isArray(m.points))m.points=['','',''];
  while(m.points.length<3)m.points.push('');
  if(!Array.isArray(m.sections))m.sections=['','','','',''];
  while(m.sections.length<5)m.sections.push('');
  if(!Array.isArray(m.shorts))m.shorts=[];
  m.shorts=m.shorts.map(s=>{const x=Object.assign(blankShort(),s||{});x.sectionIdx=Number.isInteger(+x.sectionIdx)?+x.sectionIdx:-1;return x;});
  // Scripting 2.0: section outline metadata runs parallel to the existing sections text
  if(!Array.isArray(m.secMeta))m.secMeta=[];
  while(m.secMeta.length<m.sections.length)m.secMeta.push(blankSec());
  m.secMeta=m.secMeta.map(s=>Object.assign(blankSec(),s||{}));
  if(it.scriptType==null||(m.type==='Reel'&&!SCRIPT_TYPES[m.scriptType]))m.scriptType=m.type==='Reel'?inferScriptType(m):'';
  if(!Array.isArray(m.platforms))m.platforms=defaultPlatforms(m.type);
  return m;
}
function autoDates(it,st,min){

}

/* Scripting 2.0 worked examples. Fills only blank fields on matching roadmap videos, so nothing the user wrote is ever replaced. */
function applyExamples(st){
  const find=t=>st.items.find(i=>i.roadmap&&i.title.toLowerCase()===t.toLowerCase());
  const fill=(it,o)=>{if(!it)return;Object.keys(o).forEach(k=>{
    if(k==='points'){if(it.points.every(x=>!String(x).trim()))it.points=o.points.slice();}
    else if(k==='scriptType'){if(!['hook','cta'].some(f=>String(it[f]||'').trim()))it.scriptType=o.scriptType;}
    else if(!String(it[k]||'').trim())it[k]=o[k];});};
  fill(find('What Joist Tape Does'),{scriptType:'Educational',goal:'Explain why joist tape is offered and what it protects.',
    hook:"This is one deck upgrade you'll probably never see once your deck is finished.",
    points:['Joist tape goes over the tops of the joists.','It helps protect areas of the framing from moisture.','The framing is one of the most difficult parts of the deck to replace later.'],
    cta:'We offer this as one of the upgrades you can add when designing your deck.',broll:'Roll of joist tape\nApplying tape\nExposed framing\nDeck boards being installed'});
  fill(find('Composite vs Treated Wood in 60 Seconds'),{scriptType:'Comparison',goal:'Help homeowners understand why someone might choose either material.',
    hook:'Should you actually spend the extra money on composite decking?',
    points:['Treated lumber has a lower upfront cost but requires ongoing maintenance.','Composite costs more upfront but generally requires less maintenance.','The right choice depends on budget, appearance, maintenance expectations, and the project.'],
    cta:"If you're not sure which option makes sense for your deck, send us your project and we'll walk you through both."});
  const L=find('How We Build Our Decks: Full Framing Breakdown');
  if(L&&L.sections.every(s=>!String(s).trim())&&L.secMeta.every(s=>!s.title.trim())){
    fill(L,{hook:'A finished deck might look simple from the top, but most of what determines how it performs is underneath it.',
      takeaway:'Show homeowners how Benchmark Decks frames decks and explain the reasoning behind the construction choices.'});
    const S5=[['Posts','Post size\nPlacement\nSupport','Exposed posts / footings','Why deck posts matter'],['Beams','Beam structure\nLoad support\nConnection','Beam close-up',''],
      ['Joists','Spacing\nBlocking\nLayout','','Why joist spacing matters'],['Fasteners','','','What screws we use and why'],['Protection','','','What joist tape actually does']];
    S5.forEach((s,i)=>{
      L.sections[i]=s[1];L.secMeta[i]={title:s[0],visual:s[2]};
      if(s[3]){let slot=L.shorts.find(x=>!x.reelId&&!x.hook.trim()&&x.sectionIdx<0);if(!slot){slot=blankShort();L.shorts.push(slot);}slot.hook=s[3];slot.sectionIdx=i;}
    });
  }
}

  S.items.forEach(it=>{

    add(it.publishDate,{k:it.type==='Long Form'?'long':'reel',it:it,done:x===7});

function nextOpenSlot(kind){
  const cur=mk(today()), t=today();
  for(let m=0;m<8;m++){
    const k=addMonths(cur,m), sl=rhythmDates(k).filter(s=>kind==='Long Form'?s.kind==='Long Form':s.kind!=='Long Form');
    for(const s of sl){if(s.date>=t&&!S.items.some(i=>i.publishDate===s.date&&(kind==='Long Form'?i.type==='Long Form':i.type==='Reel')))return s.date;}
  }
  return addDays(t,7);
}

/* ---------- Scripting 2.0: speaking guide + readiness ---------- */
const nonEmpty=v=>String(v==null?'':v).trim()!=='';
const secLabel=(it,i)=>{const t=(it.secMeta[i]||{}).title;return 'Section '+(i+1)+(nonEmpty(t)?': '+t:'');};
/* One place that decides what the speaker says. Custom talking points always win over the auto guide. */
function guideParts(it){
  const out=[], custom=nonEmpty(it.talking);
  if(it.type==='Long Form'){
    if(custom)return it.talking.split('\n').filter(nonEmpty).map(l=>({k:'',v:l.trim(),custom:true,point:true}));
    if(nonEmpty(it.hook))out.push({k:'Intro / hook',v:it.hook,hook:true});
    it.sections.forEach((s,i)=>{const m=it.secMeta[i]||{};if(nonEmpty(s)||nonEmpty(m.title)||nonEmpty(m.visual))out.push({k:secLabel(it,i),v:s,visual:m.visual});});
    if(nonEmpty(it.conclusion))out.push({k:'Conclusion',v:it.conclusion});
    if(nonEmpty(it.cta))out.push({k:'CTA',v:it.cta,cta:true});
    return out;
  }
  const d=scriptDef(it);
  if(nonEmpty(it.hook))out.push({k:it.scriptType==='FAQ'?'Question':'Hook',v:it.hook,hook:true});
  if(custom)it.talking.split('\n').filter(nonEmpty).forEach(l=>out.push({k:'',v:l.trim(),custom:true,point:true}));
  else it.points.forEach((p,i)=>{if(nonEmpty(p))out.push({k:d.labels[i],v:p,point:true});});
  if(nonEmpty(it.cta))out.push({k:'CTA',v:it.cta,cta:true});
  return out;
}
function talkingText(it){
  if(nonEmpty(it.talking))return it.talking;
  return guideParts(it).map(p=>(p.k?p.k+': ':'')+p.v+(p.visual?' (visual: '+p.visual+')':'')).join('\n');
}
function hasVisual(it){return Object.values(it.shots||{}).some(Boolean)||[it.broll,it.jobsite,it.shotText].some(nonEmpty);}
function pointCount(it){
  const n=it.points.filter(nonEmpty).length;
  return nonEmpty(it.talking)?Math.max(n,it.talking.split('\n').filter(nonEmpty).length):n;
}
/* Reels only. Full script, strategy, thumbnail and caption are never required. */
function scriptMissing(it){
  const m=[];
  if(!nonEmpty(it.hook))m.push('Hook');
  if(pointCount(it)<2)m.push('At least 2 talking points');
  if(!nonEmpty(it.cta))m.push('CTA');
  if(!hasVisual(it))m.push('Visual / B-roll');
  return m;
}
const scriptReady=it=>it.type==='Reel'&&!scriptMissing(it).length;
function guideHtml(parts){
  if(!parts.length)return '<p class="muted sm">Start with a hook and a couple of talking points. The guide builds itself as you type.</p>';
  return '<ol class="sg">'+parts.map(p=>'<li class="'+(p.hook?'is-hook':p.cta?'is-cta':'')+'">'+(p.k?'<span class="sg-k">'+esc(p.k)+'</span>':'')+'<span class="sg-v pre">'+esc(p.v||'')+'</span>'+(p.visual?'<span class="sg-vis">Visual: '+esc(p.visual)+'</span>':'')+'</li>').join('')+'</ol>';
}

  const body=parts.filter(p=>!p.hook&&!p.cta);
  const blk=(label,inner,cls)=>'<div class="fc-s '+(cls||'')+'"><h4>'+label+'</h4>'+inner+'</div>';
  return '<article class="fcard card" data-item-id="'+it.id+'">'
   +'<div class="fc-h"><h3>'+esc(title(it))+'</h3><div class="fc-tags">'+typeTag(it)+(L?'':'<span class="chip sm">'+esc(it.scriptType)+'</span>')+'</div></div>'
   +(hook?blk(esc(hook.k),'<p class="fc-big">'+esc(hook.v)+'</p>','fc-hook'):'')
   +(body.length?blk(L?'Outline':'Talking points','<ol class="fc-points">'+body.map(p=>'<li>'+(p.custom?'':'<span class="fp-k">'+esc(p.k)+'</span>')+'<span class="fp-v pre">'+esc(p.v||'')+'</span>'+(p.visual?'<span class="sg-vis">Visual: '+esc(p.visual)+'</span>':'')+'</li>').join('')+'</ol>'):'')
   +(cta?blk('CTA','<p class="fc-big">'+esc(cta.v)+'</p>','fc-cta'):'')
   +blk('Shot list','<div class="shots">'+REEL_SHOTS.map(s=>'<label class="chk big"><input type="checkbox" data-f="shots.'+s[0]+'" '+(it.shots[s[0]]?'checked':'')+'><span>'+s[1]+'</span></label>').join('')+'</div>'+(it.shotText?'<p class="pre">'+esc(it.shotText)+'</p>':''))
   +(it.broll?blk('B-roll needed','<p class="pre">'+esc(it.broll)+'</p>'):'')

function perfItems(){
  const f=ui.perf;
  return S.items.filter(i=>i.status==='Posted'&&(!f.type||i.type===f.type)&&(!f.platform||i.platforms.includes(f.platform))&&(!f.pillar||i.pillar===f.pillar)&&(!f.month||mk(i.publishedDate||i.publishDate)===f.month));

function bars(rows,suffix){
  if(!rows.length)return '<p class="muted">Not enough data yet.</p>';
  const max=Math.max(1,...rows.map(r=>r.v));
  return '<div class="bars">'+rows.map(r=>'<div class="brow"><span class="bl" title="'+esc(r.l)+'">'+esc(r.l)+'</span><span class="bt"><i style="width:'+(r.v/max*100)+'%"></i></span><span class="bv">'+nf(r.v)+(suffix||'')+'</span></div>').join('')+'</div>';
}
function group(items,fn){const m={};items.forEach(i=>{const k=fn(i);(m[k]=m[k]||[]).push(i);});return m;}
const sum=(a,f)=>a.reduce((t,i)=>t+num(f(i)),0);
function perfCharts(items){
  const withViews=items.filter(i=>i.perf.views!=='');
  if(!withViews.length)return empty('Add views to your posted videos in the table below and the charts will fill in.');
  const byM=group(items,i=>mk(i.publishedDate||i.publishDate)), months=Object.keys(byM).sort();
  const mrows=months.map(k=>({l:MON3[+k.slice(5,7)-1]+' '+k.slice(2,4),v:sum(byM[k],i=>i.perf.views)}));
  const maxM=Math.max(1,...mrows.map(r=>r.v));
  const byP=group(items,i=>i.pillar), prow=Object.keys(byP).map(k=>({l:k,v:sum(byP[k],i=>i.perf.views)/byP[k].length})).sort((a,b)=>b.v-a.v);
  const fmtG=group(items,i=>i.type), frow=Object.keys(fmtG).map(k=>({l:k+' ('+fmtG[k].length+')',v:sum(fmtG[k],i=>i.perf.views)/fmtG[k].length}));
  const top=items.slice().sort((a,b)=>num(b.perf.views)-num(a.perf.views)).filter(i=>num(i.perf.views)>0).slice(0,5).map(i=>({l:title(i),v:num(i.perf.views)}));
  const leads=items.slice().sort((a,b)=>num(b.perf.leads)-num(a.perf.leads)).filter(i=>num(i.perf.leads)>0).slice(0,5).map(i=>({l:title(i),v:num(i.perf.leads)}));
  const byT=group(items,i=>i.topic), trow=Object.keys(byT).map(k=>({l:k,v:sum(byT[k],i=>i.perf.views)/byT[k].length})).sort((a,b)=>b.v-a.v).slice(0,6);
  const totalViews=sum(items,i=>i.perf.views), totalLeads=sum(items,i=>i.perf.leads);
  return '<div class="kpis"><div><b>'+nf(totalViews)+'</b><span>Total views</span></div><div><b>'+nf(totalViews/Math.max(1,withViews.length))+'</b><span>Average views per video</span></div><div><b>'+nf(totalLeads)+'</b><span>Leads generated</span></div><div><b>'+items.length+'</b><span>Videos in this view</span></div></div>'
   +'<div class="chart-grid"><section class="card"><div class="card-h"><h2>Views by month</h2></div><div class="card-b"><div class="colchart">'+mrows.map(r=>'<div class="col"><span class="cv">'+nf(r.v)+'</span><i style="height:'+Math.max(3,r.v/maxM*100)+'%"></i><span class="cl">'+esc(r.l)+'</span></div>').join('')+'</div></div></section>'
   +'<section class="card"><div class="card-h"><h2>Average views by content pillar</h2></div><div class="card-b">'+bars(prow)+'</div></section>'
   +'<section class="card"><div class="card-h"><h2>Reels vs long form (average views)</h2></div><div class="card-b">'+bars(frow)+'</div></section>'
   +'<section class="card"><div class="card-h"><h2>Top-performing videos</h2></div><div class="card-b">'+bars(top)+'</div></section>'
   +'<section class="card"><div class="card-h"><h2>Leads generated by content</h2></div><div class="card-b">'+(leads.length?bars(leads):'<p class="muted">Add leads to a video to see it here.</p>')+'</div></section>'
   +'<section class="card"><div class="card-h"><h2>Most successful topics (average views)</h2></div><div class="card-b">'+bars(trow)+'</div></section></div>';
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if($('#addmenu').classList.contains('open')&&!e.target.closest('#addwrap'))closeMenu();
  if(e.target.closest('[data-stop]'))return;
  const sm=e.target.closest('summary[data-adv]');if(sm){ui.advOpen[sm.dataset.adv]=!sm.parentElement.open;return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACTS[a.dataset.act]){
    if(a.tagName==='INPUT'&&a.type==='checkbox'){ACTS[a.dataset.act](a,e);return;}
    ACTS[a.dataset.act](a,e);
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){ui.q=el.value;if(ui.view!=='library')ui.view='library';render();return;}
  if(el.dataset.plat){
    const h=el.closest('[data-item-id]'),it=h&&getItem(h.dataset.itemId);if(!it)return;
    const p=el.dataset.plat,has=it.platforms.includes(p);
    if(el.checked&&!has)it.platforms.push(p);if(!el.checked&&has)it.platforms=it.platforms.filter(x=>x!==p);
    save();return;
  }
  if(el.dataset.ui){
    sp(ui,el.dataset.ui,el.type==='checkbox'?el.checked:el.value);
    if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date')render();
    return;
  }
  if(el.dataset.s){
    const v=el.type==='checkbox'?el.checked:(el.type==='number'?Math.max(0,num(el.value)):el.value);
    sp(S,el.dataset.s,v);
    if(el.dataset.s==='settings.theme')applyTheme();
    if(el.dataset.s==='settings.company')applyTheme();
    if(el.dataset.s.indexOf('jobsite.checks')===0)render();
    save();return;
  }
  if(el.dataset.f){
    const h=el.closest('[data-item-id]'),it=h&&getItem(h.dataset.itemId);if(!it)return;
    const path=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;
    if(/^shorts\.\d+\.sectionIdx$/.test(path)){v=v===''?-1:+v;sp(it,path,v);save();renderEditor();return;}
    sp(it,path,v);
    if(path==='scriptType'){save();renderEditor();return;}
    if(path==='publishDate'&&v){it.plannedMonth=mk(v);const pm=h.querySelector('[data-f="plannedMonth"]');if(pm)pm.value=it.plannedMonth;}
    if(path==='status'){if(v==='Posted'&&!it.publishedDate)it.publishedDate=today();save();renderEditor();return;}
    if(path==='type'){ensureType(it);it.platforms=defaultPlatforms(it.type);save();renderEditor();return;}
    if(path==='winning'){save();renderEditor();return;}
    if(path==='reelKind'&&v==='Recap'&&!it.recap.month)it.recap.month=monthName(monthOf(it)||ui.month);
    if(path.indexOf('perf.')===0&&ui.view==='performance')refreshPerf();
    save();liveScript(it);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('input[data-import]')){
    const f=el.files&&el.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.items))throw new Error('bad');S=fixState(o);save(true);applyTheme();ui.month=focusMonthDefault();ui.calMonth=ui.month;ui.pipeMonth=ui.month;render();toast('Backup restored');}catch(err){toast('That file is not a Content HQ backup');}};
    r.readAsText(f);el.value='';
  }
});
document.addEventListener('submit',e=>{

  e.preventDefault();

document.addEventListener('keydown',e=>{
