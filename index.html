/* ---------- shareable calendar image (drawn on a canvas, always light) ---------- */
/* The shared calendar image is always drawn light, from the same semantic colors as the CSS (--reel-color, --filming-color, ...) */
const XP={reel:[SEM.reel[0],SEM.reel[1]],long:[SEM.long[0],SEM.long[1]],film:[SEM.film[0],'#FFFFFF'],edit:[SEM.edit[0],'#FFFFFF'],script:[SEM.plan[0],SEM.plan[1]],plan:[SEM.plan[0],SEM.plan[1]]};
const XP_TAG={reel:'REEL',long:'LONG-FORM',film:'FILMING',edit:'EDIT DUE',script:'SCRIPT DUE',plan:'PLANNING'};
const XF={title:'600 54px "Barlow Condensed","Arial Narrow",sans-serif',num:'600 24px "Barlow Condensed","Arial Narrow",sans-serif',text:'500 16.5px Figtree,system-ui,sans-serif',tag:'700 11.5px Figtree,system-ui,sans-serif',dow:'700 13px Figtree,system-ui,sans-serif',leg:'600 15.5px Figtree,system-ui,sans-serif',small:'500 14px Figtree,system-ui,sans-serif'};
function wrapText(ctx,text,maxW,maxLines){
  const fit=s=>ctx.measureText(s).width<=maxW, lines=[];let cur='';
  String(text).split(/\s+/).filter(Boolean).forEach(w=>{
    if(cur&&fit(cur+' '+w)){cur+=' '+w;return;}
    if(cur){lines.push(cur);cur='';}
    while(w.length>1&&!fit(w)){let n=w.length-1;while(n>1&&!fit(w.slice(0,n)))n--;lines.push(w.slice(0,n));w=w.slice(n);}
    cur=w;
  });
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    lines.length=maxLines;let l=lines[maxLines-1];
    while(l.length>1&&!fit(l+'…'))l=l.slice(0,-1);
    lines[maxLines-1]=l.trim()+'…';
  }
  return lines;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function xpBox(ctx,k,x,y,w,h){
  const c=XP[k];
  rr(ctx,x,y,w,h,7);ctx.fillStyle=c[1];ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle=c[0];ctx.fillRect(x,y,5,h);ctx.restore();
  if(c[1]==='#FFFFFF'){rr(ctx,x+.5,y+.5,w-1,h-1,7);ctx.strokeStyle=c[0];ctx.lineWidth=1.25;if(k==='plan')ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);}
}
async function calCanvas(key,mode){
  try{await Promise.race([Promise.all(Object.keys(XF).map(f=>document.fonts.load(XF[f]))),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  const W=1680,P=56,CW=(W-P*2)/7,TW=CW-20-22,INK='#1C2422',MUTED='#76827C',LINE='#D9DED6';
  const ev=eventsFor(mode), days=calDays(key), m=document.createElement('canvas').getContext('2d');
  let anyDone=false;
  m.font=XF.text;
  const cells=days.map(s=>({s:s,out:mk(s)!==key,chips:dayChips(ev[s]||[]).map(c=>{
    const n=c.items.length;let lines;
    if(n===1)lines=wrapText(m,title(c.items[0]),TW,3);
    else{lines=c.items.slice(0,4).map(it=>wrapText(m,'• '+title(it),TW,1)[0]);if(n>4)lines.push('+ '+(n-4)+' more');}
    if(c.done)anyDone=true;
    return {k:c.k,done:c.done,tag:XP_TAG[c.k]+(n>1?' · '+n+' VIDEOS':'')+(c.done?'  ✓':''),lines:lines,h:27+lines.length*21+8};
  })}));
  const rowH=[];
  for(let r=0;r<cells.length/7;r++)rowH.push(Math.max(150,...cells.slice(r*7,r*7+7).map(c=>46+c.chips.reduce((a,x)=>a+x.h+6,0)+6)));
  const legY=P+72, gridY=legY+34+24, dowH=40, gridH=dowH+rowH.reduce((a,b)=>a+b,0), H=gridY+gridH+62;
  const sc=Math.min(2,Math.sqrt(14e6/(W*H))), cv=document.createElement('canvas');
  cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
  const ctx=cv.getContext('2d');ctx.scale(sc,sc);ctx.textBaseline='alphabetic';
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
  // title and legend
  ctx.fillStyle=INK;ctx.font=XF.title;ctx.fillText('Content Calendar — '+monthLabel(key),P,P+44);
  ctx.font=XF.leg;ctx.fillStyle=MUTED;ctx.textAlign='right';ctx.fillText(coName(),W-P,P+44);ctx.textAlign='left';
  let lx=P;ctx.font=XF.leg;
  calKinds(mode).forEach(k=>{
    const w=5+12+ctx.measureText(EV_LEGEND[k]).width+14;
    xpBox(ctx,k,lx,legY,w,34);ctx.fillStyle=INK;ctx.fillText(EV_LEGEND[k],lx+17,legY+22.5);lx+=w+10;
  });
  // grid
  ctx.save();rr(ctx,P,gridY,W-P*2,gridH,12);ctx.clip();
  ctx.fillStyle='#F5F7F4';ctx.fillRect(P,gridY,W-P*2,dowH);
  ctx.font=XF.dow;ctx.fillStyle=MUTED;
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach((d,i)=>ctx.fillText(d,P+i*CW+12,gridY+25.5));
  let y=gridY+dowH;
  rowH.forEach((h,r)=>{
    for(let i=0;i<7;i++){
      const c=cells[r*7+i], x=P+i*CW, day=+c.s.slice(8);
      if(c.out){ctx.fillStyle='#F5F7F4';ctx.fillRect(x,y,CW,h);}
      ctx.font=XF.num;ctx.fillStyle=c.out?'#A3ADA8':INK;ctx.fillText((c.out&&day===1?MON3[+c.s.slice(5,7)-1]+' ':'')+day,x+12,y+31);
      let cy=y+44;
      c.chips.forEach(ch=>{
        ctx.globalAlpha=c.out?.45:ch.done?.55:1;
        xpBox(ctx,ch.k,x+10,cy,CW-20,ch.h);
        ctx.font=XF.tag;ctx.fillStyle=XP[ch.k][0];ctx.fillText(ch.tag,x+24,cy+19);
        ctx.font=XF.text;ctx.fillStyle=INK;ch.lines.forEach((l,j)=>ctx.fillText(l,x+24,cy+42+j*21));
        ctx.globalAlpha=1;cy+=ch.h+6;
      });
    }
    y+=h;
  });
  ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.beginPath();
  for(let i=1;i<7;i++){const x=Math.round(P+i*CW)+.5;ctx.moveTo(x,gridY);ctx.lineTo(x,gridY+gridH);}
  y=gridY+dowH;rowH.forEach(h=>{ctx.moveTo(P,Math.round(y)+.5);ctx.lineTo(W-P,Math.round(y)+.5);y+=h;});
  ctx.stroke();ctx.restore();
  rr(ctx,P+.5,gridY+.5,W-P*2-1,gridH-1,12);ctx.strokeStyle='#C7CEC4';ctx.lineWidth=1;ctx.stroke();
  // footer
  ctx.font=XF.small;ctx.fillStyle=MUTED;
  if(anyDone)ctx.fillText('✓ and faded = that step is already done',P,gridY+gridH+32);
  ctx.textAlign='right';ctx.fillText('Updated '+fmt(today())+', '+today().slice(0,4),W-P,gridY+gridH+32);ctx.textAlign='left';
  return cv;
}
let shareImg=null, shareTok=0;
function calShare(){
  const key=ui.calMonth, label=monthLabel(key), co=coName(), tok=++shareTok;
  if(shareImg){URL.revokeObjectURL(shareImg.url);shareImg=null;}
  showModal('<div class="modal-h"><h3>Share calendar · '+esc(label)+'</h3><button class="icon-btn" data-act="modalClose" aria-label="Close">'+I('x')+'</button></div><div class="modal-b" id="share-b"><p class="muted">Building the image…</p></div>','xl');
  calCanvas(key,ui.calMode).then(cv=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('no image')),'image/png'))).then(blob=>{
    // A newer share (or a client switch) replaced this one while it was drawing
    const b=$('#share-b');if(!b||tok!==shareTok)return;
    const name='content-calendar-'+slug(co)+'-'+key+'.png';
    shareImg={blob:blob,name:name,url:URL.createObjectURL(blob),file:null,title:co+' content calendar — '+label};
    try{shareImg.file=new File([blob],name,{type:'image/png'});}catch(e){}
    const all=canCopyImg()&&canShareImg();
    b.innerHTML='<div class="share-scroll"><img class="share-prev" src="'+shareImg.url+'" alt="'+esc(co)+' content calendar for '+esc(label)+'"></div>'
     +'<div class="row-gap"><button class="btn primary" data-act="calDl">'+I('download')+'Download PNG</button><button class="btn ghost" data-act="calCopy">'+I('copy')+'Copy image</button><button class="btn ghost" data-act="calSend">'+I('share')+'Share…</button></div>'
     +'<p class="muted sm" style="margin:12px 0 0">This is the '+(ui.calMode==='prod'?'Production':'Content')+' view of '+esc(label)+'.'+(all?'':' Copy and Share depend on the browser. If one is not available here, the image downloads instead.')+'</p>';
  }).catch(()=>{const b=$('#share-b');if(b&&tok===shareTok)b.innerHTML='<p>The calendar image could not be created in this browser.</p>';});
}
const canCopyImg=()=>!!(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem);
function canShareImg(){try{return !!(shareImg&&shareImg.file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[shareImg.file]}));}catch(e){return false;}}
function shareDl(msg){
  if(!shareImg)return;
  const a=document.createElement('a');a.href=shareImg.url;a.download=shareImg.name;document.body.appendChild(a);a.click();a.remove();
  toast(msg||'Calendar image downloaded');
}
function shareCopy(){
  if(!shareImg)return;
  if(!canCopyImg())return shareDl('This browser cannot copy images, so it was downloaded instead');
  navigator.clipboard.write([new ClipboardItem({'image/png':shareImg.blob})]).then(()=>toast('Calendar image copied'),()=>shareDl('Could not copy the image, so it was downloaded instead'));
}
function shareSend(){
  if(!shareImg)return;
  if(!canShareImg())return shareDl('This browser cannot share images, so it was downloaded instead');
  navigator.share({files:[shareImg.file],title:shareImg.title}).catch(e=>{if(!e||e.name!=='AbortError')shareDl('Sharing did not open, so the image was downloaded instead');});
}

/* ---------- Scripting 2.0: speaking guide + readiness ---------- */
const nonEmpty=v=>String(v==null?'':v).trim()!=='';

const pointTexts=it=>it.blocks.map(b=>b.text.trim()).filter(Boolean);

/* ---------- Shot list ---------- */
/* Built fresh from the script every time, so descriptions, order and references always follow the Script tab.

const allBlocks=it=>it.blocks.concat.apply(it.blocks,it.secMeta.map(x=>x.blocks||[]));
function shotList(it){
  const out=[], L=it.type==='Long Form', M=it.shotMeta;

/* ---------- Speaker script: one helper formats everything that gets shared ---------- */
/* Formats existing script fields for a speaker. It never rewrites wording, it only trims and spaces. */
const spkClean=s=>String(s==null?'':s).replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).join('\n').replace(/\n{3,}/g,'\n\n').trim();
const spkUnquote=s=>{s=spkClean(s);const m=s.match(/^["“](.*)["”]$/s);return m&&!/["“”]/.test(m[1])?m[1].trim():s;};
const spkVersion=it=>it.speakerVersion!=='structured'&&nonEmpty(it.script)?'full':'structured';
function speakerBlocks(it){
  const header=['VIDEO: '+spkClean(title(it))].concat(nonEmpty(it.speaker)?['SPEAKER: '+spkClean(it.speaker)]:[]);
  if(spkVersion(it)==='full')return {header:header,blocks:[{label:'',text:spkClean(it.script)}],full:true};
  const b=[], add=(label,text)=>{text=spkUnquote(text);if(text)b.push({label:label,text:text});};
  if(it.type==='Long Form'){
    add('INTRO / HOOK',it.hook);let n=0;
    it.sections.forEach((s,i)=>{const t=spkClean((it.secMeta[i]||{}).title),pts=spkClean(secText(it,i));if(!t&&!pts)return;n++;
      b.push({label:'SECTION '+n+(t?': '+t:''),text:pts||t,titleOnly:!pts});});
    add('CONCLUSION',it.conclusion);add('CTA',it.cta);
  }else{
    add('HOOK',it.hook);
    let n=0;
    it.blocks.forEach(x=>{const t=spkUnquote(x.text);if(t){n++;b.push({label:'PART '+n,text:t});}});
    add('CTA',it.cta);
  }
  return {header:header,blocks:b,full:false};
}
/* mode 'script' = full speaker script (labels optional), 'points' = short talking-points sheet */
function speakerText(it,mode){
  const d=speakerBlocks(it);
  if(mode==='points'){
    const out=[[spkClean(title(it))].concat(nonEmpty(it.speaker)?['SPEAKER: '+spkClean(it.speaker)]:[]).join('\n')];
    const hook=spkUnquote(it.hook), cta=spkUnquote(it.cta), list=[];
    if(it.type==='Long Form'){
      it.sections.forEach((s,i)=>{const t=spkClean((it.secMeta[i]||{}).title),pts=secPts(it,i).map(x=>spkClean(x.t).replace(/\n+/g,' ')).filter(nonEmpty);if(!t&&!pts.length)return;
        list.push(t?'- '+t+(pts.length?'\n'+pts.map(x=>'  '+x.trim()).join('\n'):''):pts.map(x=>'- '+x.trim()).join('\n'));});
    }else{
      it.blocks.forEach(x=>{const t=spkUnquote(x.text);if(t)list.push('- '+t.split('\n').join('\n  '));});
    }
    if(hook)out.push((it.type==='Long Form'?'INTRO / HOOK':'HOOK')+'\n'+hook);
    if(list.length)out.push('TALKING POINTS\n'+list.join('\n'));
    if(it.type==='Long Form'&&nonEmpty(it.conclusion))out.push('CONCLUSION\n'+spkUnquote(it.conclusion));

  if(!d.blocks.length)return '';
  if(!it.speakerLabels)return d.blocks.map(x=>x.titleOnly?'':x.text).filter(Boolean).join('\n\n');

}

/* ---------- Caption system ---------- */
const capSentence=s=>{s=String(s==null?'':s).trim().replace(/^["“”']+|["“”']+$/g,'').trim();if(!s)return '';s=s[0].toUpperCase()+s.slice(1);return /[.!?…:]$/.test(s)?s:s+'.';};
const noEnd=s=>String(s==null?'':s).trim().replace(/^["“”']+|["“”']+$/g,'').replace(/[.!?]+$/,'').trim();
const lowerFirst=s=>/^[A-Z][a-z]/.test(s||'')?s[0].toLowerCase()+s.slice(1):(s||'');
const titleLc=s=>String(s||'').split(' ').map(w=>/^[A-Z][a-z']+$/.test(w)?w.toLowerCase():w).join(' ');
const firstSentence=s=>{s=String(s||'').trim();const m=s.match(/^[\s\S]*?[.!?](?=\s|$)/);return (m?m[0]:s.split('\n')[0]).trim();};
const cleanTopic=t=>String(t||'').replace(/\s*[:—–]\s.*$/,'').replace(/\s+(in \d+ seconds|explained)$/i,'').trim();
const vsParts=t=>{const m=cleanTopic(t).split(/\s+vs\.?\s+/i);return m.length===2?m:null;};
/* Deterministic draft from the script. No AI: it reorders and lightly rephrases what is already written. */
function captionFromScript(it){
  const ph=P().phrases, P_=pointTexts(it), hook=capSentence(it.hook), cta=capSentence(it.cta);
  let h=hook;const body=[];
  const lead=(x,start,phrase)=>{const s=noEnd(x);return new RegExp('^'+start,'i').test(s)?capSentence(s):capSentence(phrase+lowerFirst(s));};
  switch(it.captionStyle){
    case 'Comparison':{const v=vsParts(title(it));if(v)h=v[0]+' or '+titleLc(v[1])+'?';
      if(P_[0]&&P_[1])body.push(capSentence(P_[0])+' '+capSentence(P_[1]));else P_.slice(0,2).forEach(x=>body.push(capSentence(x)));
      if(P_[2])body.push(capSentence(P_[2]));break;}
    case 'FAQ':{if(h&&!/\?$/.test(h)&&/^(do|does|is|are|can|should|how|what|why|when|which|will)\b/i.test(h))h=h.replace(/[.!]$/,'?');
      if(P_[0])body.push(capSentence(P_[0]));if(P_[1]||P_[2])body.push(P_.slice(1).map(capSentence).join(' '));break;}
    case 'Project Showcase':{h=h||ph.showcaseOpen;
      if(P_[0])body.push(lead(P_[0],'the goal',ph.showcaseGoal+' '));
      if(P_[1])body.push(lead(P_[1],'we ',ph.showcaseMade+' '));
      if(P_[2])body.push(lead(P_[2],'one of',ph.showcaseFeature+' '));break;}
    case 'Promotional':{if(!h&&P_[0]){h=capSentence(P_[0]);P_.shift();}else if(P_[0]&&h){body.push(capSentence(P_[0]));P_.shift();}
      P_.forEach(x=>body.push(capSentence(x)));break;}
    case 'Company / Trust':{if(P_[0]||P_[1])body.push(P_.slice(0,2).map(capSentence).join(' '));if(P_[2])body.push(capSentence(P_[2]));break;}
    case 'Process':{if(P_.length)body.push("Here's how it works:\n"+P_.map((x,i)=>(i+1)+'. '+noEnd(x)).join('\n'));
      const why=it.mainMessage||it.takeaway;if(nonEmpty(why))body.push(capSentence(why));break;}
    case 'Short & Simple':{h=h||capSentence(it.mainMessage)||capSentence(P_[0]);break;}
    default:{if(P_[0])body.push(capSentence(P_[0])+(P_[1]?' '+capSentence(P_[1]):''));if(P_[2])body.push(capSentence(P_[2]));}
  }
  if(!h)h=capSentence(it.mainMessage);
  return {hook:h,body:body.filter(nonEmpty).join('\n\n'),cta:cta};
}
const assembleSocial=it=>[it.captionHook,it.captionBody,it.captionCTA].map(x=>String(x||'').trim()).filter(Boolean).join('\n\n');

/* ================= performance ================= */
/* Each snapshot is one platform at one checkpoint. Platforms are never merged in storage; totals are calculated for display. */
const CHECKPOINTS=[['24h',1],['7d',7],['30d',30]];
const CP_NAME={'24h':'24-hour','7d':'7-day','30d':'30-day',existing:'Earlier results'};
const CP_SHORT={'24h':'24h','7d':'7d','30d':'30d',existing:'Earlier'};
const CP_ORDER={existing:0,'24h':1,'7d':2,'30d':3};
const SNAP_PLATS=['Instagram','Facebook','YouTube Shorts','YouTube'];
const SNAP_LABEL={'Instagram':'Instagram','Facebook':'Facebook','YouTube Shorts':'YouTube Shorts','YouTube':'YouTube Long Form','All':'All platforms combined'};
const METRICS={views:'Views',likes:'Likes',comments:'Comments',shares:'Shares',saves:'Saves',watchTime:'Watch time (hours)',avgViewDuration:'Avg view duration',avgPercentViewed:'Avg % viewed',followersGained:'Followers gained',subscribersGained:'Subscribers gained',leads:'Leads'};
const NUM_METRICS=Object.keys(METRICS).filter(k=>k!=='avgViewDuration');
const METRICS_DUE_DAYS=45; // after this, missed checkpoints stop showing as due
function metricFields(platform){
  if(platform==='YouTube')return ['views','watchTime','avgViewDuration','avgPercentViewed','likes','comments','subscribersGained','leads'];
  if(platform==='YouTube Shorts')return ['views','likes','comments','shares','avgViewDuration','subscribersGained','leads'];
  if(platform==='All')return ['views','watchTime','avgViewDuration','likes','comments','shares','saves','leads'];
  return ['views','likes','comments','shares','saves','avgViewDuration','followersGained','leads'];
}
const numOrNull=v=>{if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n;};
function normSnap(x){
  const o={id:String(x.id||uid()),clientId:String(x.clientId||activeId()),contentId:String(x.contentId||''),platform:String(x.platform||'All'),checkpoint:CP_ORDER[x.checkpoint]!=null?x.checkpoint:'existing',
    recordedAt:String(x.recordedAt||''),publishedAt:String(x.publishedAt||''),avgViewDuration:String(x.avgViewDuration==null?'':x.avgViewDuration),notes:String(x.notes==null?'':x.notes),legacy:!!x.legacy};
  NUM_METRICS.forEach(k=>{o[k]=numOrNull(x[k]);});
  return o;
}
/* Items saved before snapshots had one set of results with no date or checkpoint. It is copied, never guessed into 24h / 7d / 30d,
   into one "Earlier results" snapshot for all platforms combined. The original perf fields stay on the item untouched. */
const LEGACY_PERF=['views','likes','comments','shares','saves','watchHours','avgDuration','leads'];
function legacyPerfHas(it){const p=it&&it.perf;return !!p&&typeof p==='object'&&LEGACY_PERF.some(k=>p[k]!=null&&String(p[k]).trim()!=='');}
function migratePerf(st){
  st.items.forEach(it=>{
    if(!legacyPerfHas(it)||st.perfSnapshots.some(x=>x.contentId===it.id&&x.legacy))return;
    const p=it.perf;
    st.perfSnapshots.push(normSnap({contentId:it.id,platform:'All',checkpoint:'existing',legacy:true,publishedAt:it.publishedDate||it.publishDate||'',
      views:p.views,likes:p.likes,comments:p.comments,shares:p.shares,saves:p.saves,watchTime:p.watchHours,avgViewDuration:p.avgDuration,leads:p.leads,
      notes:'Carried over from the results saved before performance snapshots. The checkpoint was not recorded.'}));
  });
}
/* A Reel posted to "YouTube" is a Short */
function snapPlats(it){
  const s=new Set((it.platforms||[]).map(p=>it.type!=='Long Form'&&p==='YouTube'?'YouTube Shorts':p));
  return SNAP_PLATS.filter(p=>s.has(p));
}
const pubDate=it=>it.publishedDate||it.publishDate||'';
const snapsFor=id=>S.perfSnapshots.filter(x=>x.contentId===id);
const findSnap=(id,pl,cp)=>S.perfSnapshots.find(x=>x.contentId===id&&x.platform===pl&&x.checkpoint===cp);
/* Latest snapshot per platform (30d beats 7d beats 24h) */
function latestByPlat(id){
  const L={};snapsFor(id).forEach(x=>{const c=L[x.platform];if(!c||CP_ORDER[x.checkpoint]>CP_ORDER[c.checkpoint])L[x.platform]=x;});return L;
}
/* One number for a video: the sum of each platform's latest snapshot. The combined earlier results only count when no platform snapshot exists, so nothing is counted twice. */
function vt(it,field,plat){
  const L=latestByPlat(it.id);
  if(plat){const s=L[plat];return s&&s[field]!=null?s[field]:null;}
  const real=Object.keys(L).filter(p=>p!=='All');
  if(real.length){const v=real.map(p=>L[p][field]).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0):null;}
  return L.All&&L.All[field]!=null?L.All[field]:null;
}
const vtShow=(it,f)=>{const v=vt(it,f);return v==null?'–':nf(v);};
function metricsDue(){
  const t=today(), out=[];
  S.items.forEach(it=>{
    if(it.status!=='Posted')return;const pub=pubDate(it);if(!pub)return;
    const age=dayDiff(pub,t);if(age<1||age>METRICS_DUE_DAYS)return;
    const c=CHECKPOINTS.filter(x=>age>=x[1]).pop();if(!c)return;
    snapPlats(it).forEach(pl=>{
      if(findSnap(it.id,pl,c[0])||S.metricSkips[it.id+'|'+pl+'|'+c[0]])return;
      out.push({it:it,platform:pl,cp:c[0],due:addDays(pub,c[1]),pub:pub});
    });
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due)||title(a.it).localeCompare(title(b.it)));
}

  if(!plats.length)h+='<tr><td colspan="4" class="muted">Pick platforms on the Overview tab to track results per platform.</td></tr>';
  h+=plats.map(pl=>'<tr><th scope="row">'+esc(SNAP_LABEL[pl]||pl)+'</th>'+CHECKPOINTS.map(c=>'<td>'+cell(pl,c[0],c[1])+'</td>').join('')+'</tr>').join('');
  h+='</tbody></table></div>';
  if(hasLegacy){const x=snaps.find(s=>s.platform==='All');h+='<div class="snap-legacy"><span><b>Earlier results</b> · all platforms combined, saved before snapshots (checkpoint unknown)</span><button class="snap-c" data-act="snapEdit" data-sid="'+x.id+'"><b>'+(x.views!=null?nf(x.views):'–')+'</b><small>views</small></button></div>';}
  const v=vt(it,'views'), l=vt(it,'leads');
  if(v!=null||l!=null)h+='<p class="muted sm snap-total">Latest combined: <b>'+(v!=null?nf(v):'–')+'</b> views'+(l!=null?' · <b>'+nf(l)+'</b> leads':'')+'. Each platform keeps its own numbers.</p>';
  return h;

/* ---------- reading a pack from a file or an AI answer. Pasted text is data only: parsed, cleaned and always escaped. ---------- */
/* Finds the first complete {...} in text that parses as JSON. Code fences and chat text around it are ignored. */
function extractJson(text){
  const t=String(text||'');let starts=0, sawOpen=false, lastErr='';
  for(let start=t.indexOf('{');start>=0&&starts<25;start=t.indexOf('{',start+1),starts++){
    sawOpen=true;let depth=0,inStr=false,escp=false,end=-1;
    for(let i=start;i<t.length;i++){
      const c=t[i];
      if(inStr){if(escp)escp=false;else if(c==='\\')escp=true;else if(c==='"')inStr=false;continue;}
      if(c==='"')inStr=true;else if(c==='{')depth++;else if(c==='}'){depth--;if(!depth){end=i;break;}}
    }
    if(end<0)continue;
    try{return {obj:JSON.parse(t.slice(start,end+1))};}catch(e){if(!lastErr)lastErr=e.message;}
  }
  if(!sawOpen)return {error:'There is no JSON in that text. The answer should contain the pack, starting with { and ending with }.'};
  if(lastErr)return {error:'The JSON has a mistake in it ('+lastErr+'). Ask the AI to return only valid JSON, or fix it and check again.'};
  return {error:'The JSON looks cut off: it starts with { but never closes. Ask the AI to send the complete JSON again.'};
}
function parsePackText(text,from){
  text=String(text||'');
  if(!text.trim())return {error:from==='ai'?'Paste the AI’s answer first.':'That file is empty.'};
  if(text.length>500000)return {error:'That is far too long to be a wording pack.'};
  let o=null;
  try{o=JSON.parse(text);}catch(e){const x=extractJson(text);if(x.error)return x;o=x.obj;}
  return packFromObject(o,from);
}
function packFromObject(o,from){
  if(!isPlain(o))return {error:'That is not a wording pack.'};
  if(isPlain(o.client)&&isPlain(o.client.data)&&isPlain(o.client.data.pack))o=o.client.data.pack;   // a client backup: use its wording
  else if(Array.isArray(o.clients)||Array.isArray(o.items)||isPlain(o.client))return {error:'That is a backup file, not a wording pack. Use Import backup under Backup and restore, or Export pack to make a pack file.'};
  const known=['pillars','topics','groups','hookLibrary','ctaLibrary','captionOpenings','hashtagGroups','shotList','captureChecklist'];
  if(o.format!==PACK_FORMAT&&!known.some(k=>own(o,k)))return {error:'That does not look like a wording pack. It has none of the expected parts (pillars, topics, hookLibrary and so on).'};
  const r=cleanPack(o);
  if(from==='ai')r.pack.source='ai';
  else if(!['deck','construction','restaurant','realestate','blank'].includes(r.pack.source))r.pack.source='import';
  return r;
}

function textToPack(d,base){
  const E=[], lines=v=>String(v||'').split('\n').map((l,i)=>[l.trim(),i+1]).filter(x=>x[0]);
  const split=l=>{const i=l.indexOf('|');return i<0?null:[l.slice(0,i).trim(),l.slice(i+1).trim()];};
  const lc=x=>String(x).toLowerCase(), findIn=(list,v)=>list.find(x=>lc(x)===lc(v));
  const raw=pclone(base);
  raw.name=String(d.name||'').trim();if(!raw.name)E.push('About: give the wording a name.');
  raw.description=d.description;raw.voice=d.voice;raw.terms={audience:d.audience};
  raw.pillars=lines(d.pillars).map(([l,n])=>{const p=l.split('|').map(x=>x.trim());if(!p[0]){E.push('Pillars, line '+n+': start with the pillar name, like "Projects | Show finished work | Reveal; Walkthrough".');return null;}
    return {name:p[0],purpose:p[1]||'',ex:p.slice(2).join(' | ').split(';').map(x=>x.trim()).filter(Boolean)};}).filter(Boolean);
  raw.groups=lines(d.groups).map(x=>x[0]);
  raw.groupFor={};
  raw.topics=lines(d.topics).map(([l,n])=>{const p=split(l)||[l,''];if(!p[0]){E.push('Topics, line '+n+': start with the topic name.');return null;}
    if(p[1]){const g=findIn(raw.groups,p[1]);if(!g)E.push('Topics, line '+n+': the group "'+p[1]+'" is not in the Idea Bank groups box. Add it there or fix the spelling.');else raw.groupFor[p[0]]=g;}
    return p[0];}).filter(Boolean);
  const lib=(v,box,eg)=>{const out=[], by=Object.create(null);lines(v).forEach(([l,n])=>{const p=split(l);
    if(!p||!p[0]||!p[1]){E.push(box+', line '+n+': use "Category | text", like "'+eg+'".');return;}
    const k=lc(p[0]);if(!by[k]){by[k]={cat:p[0],items:[]};out.push(by[k]);}by[k].items.push(p[1]);});return out;};
  raw.hookLibrary=lib(d.hooks,'Hooks','Question | Should you ___ or ___?');
  raw.ctaLibrary=lib(d.ctas,'CTAs','Website | See more on our website.');
  raw.captionOpenings=lib(d.captions,'Caption openings','FAQ | One question we get all the time is ___.');
  raw.hashtagGroups={};
  lines(d.hashtags).forEach(([l,n])=>{const p=split(l)||[l,''];if(!p[0]){E.push('Hashtags, line '+n+': start with the group name, like "General | #Tag #Tag".');return;}if(/\./.test(p[0])){E.push('Hashtags, line '+n+': group names can’t contain a period.');return;}raw.hashtagGroups[p[0]]=p[1];});
  const keyed=(v,old)=>lines(v).map(([l])=>{const m=old.find(x=>lc(x[1])===lc(l));return [m?m[0]:'',l];});
  raw.shotList=keyed(d.shots,base.shotList);raw.recapFields=keyed(d.recap,base.recapFields);
  raw.captureChecklist=lib(d.capture,'Capture checklist','Before | Wide shot of the space').map(g=>({g:g.cat,items:g.items}));
  raw.scriptHints={};
  lines(d.hints).forEach(([l,n])=>{const p=l.split('|').map(x=>x.trim()), t=findIn(SCRIPT_TYPE_NAMES,p[0]);
    if(!t){E.push('Script hints, line '+n+': "'+p[0]+'" is not a script type. Use one of: '+SCRIPT_TYPE_NAMES.join(', ')+'.');return;}
    raw.scriptHints[t]={ph:[p[1]||'',p[2]||'',p[3]||''],hookPh:p[4]||''};});
  raw.labels={};
  lines(d.labels).forEach(([l,n])=>{const p=split(l), k=p&&findIn(LABEL_KEYS,p[0]);
    if(!k){E.push('Labels, line '+n+': start with one of these names, then | and the text: '+LABEL_KEYS.join(', ')+'.');return;}raw.labels[k]=p[1];});
  raw.promptRules={script:lines(d.rulesScript).map(x=>x[0]),caption:lines(d.rulesCaption).map(x=>x[0])};
  raw.projectForm=pclone(base.projectForm);
  lines(d.projForm).forEach(([l,n])=>{const p=l.split('|').map(x=>x.trim()), k=findIn(PROJ_FIELDS,p[0]);
    if(!k){E.push('Project form, line '+n+': start with one of: '+PROJ_FIELDS.join(', ')+'.');return;}
    raw.projectForm[k]={label:p[1]||'',ph:p[2]||'',fallback:p[3]||''};});
  raw.projectIdeas=lines(d.ideas).map(([l,n])=>{const p=l.split('|').map(x=>x.trim()), f=lc(p[0]).replace(/[-\s]+/g,' ');
    const fmt=f==='reel'?'Reel':f==='long form'?'Long Form':(f==='none'||f===''?'':null);
    if(fmt==null){E.push('Project ideas, line '+n+': start with Reel, Long Form or None.');return null;}
    if(!p[3]){E.push('Project ideas, line '+n+': add a title, like "Reel | Pillar | Topic | Reveal: {name} | Hero shots".');return null;}
    return {label:p[5]||p[3],format:fmt,pillar:p[1]||'',topic:p[2]||'',title:p[3],note:p[4]||''};}).filter(Boolean);
  const pr=String(d.preset||'').trim();raw.postedPreset=null;
  if(pr){const p=split(pr);if(!p||!p[0]||!p[1])E.push('Library shortcut: use "Label | Pillar", or leave it empty.');else raw.postedPreset={label:p[0],pillar:p[1]};}
  if(E.length)return {errors:E};
  const r=cleanPack(raw);r.pack.source=base.source;
  return {errors:[],pack:r.pack,warnings:r.warnings};
}

/* ---------- resizable editor panel ----------
   Desktop only. The width is a per-device UI preference, kept in its own key next to (never inside) the saved content.
   It is stored as a share of the window width, so it carries over between a laptop screen and a monitor. */
const UI_KEY=LS_KEY+'.ui';
const PANEL={min:480,def:.5,max:.8,focus:.94};
let prefs={editorWidth:null};
function loadPrefs(){try{const o=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(o&&typeof o==='object'){const w=+o.editorWidth;prefs.editorWidth=w>0&&w<1?w:null;}}catch(e){}}
function savePrefs(){try{localStorage.setItem(UI_KEY,JSON.stringify(prefs));}catch(e){}}
const panelWide=()=>matchMedia('(min-width:1024px)').matches;
function panelClamp(px){const W=window.innerWidth,max=W*PANEL.max;return Math.round(Math.min(max,Math.max(Math.min(PANEL.min,max),px)));}
function panelWidth(){
  const W=window.innerWidth;
  if(ui.panelFocus)return Math.round(W*PANEL.focus);
  return panelClamp(prefs.editorWidth?prefs.editorWidth*W:Math.max(720,W*PANEL.def));
}
function applyPanel(){const r=document.documentElement.style;if(panelWide())r.setProperty('--drw',panelWidth()+'px');else r.removeProperty('--drw');}
function setPanel(px){ui.panelFocus=false;prefs.editorWidth=panelClamp(px)/window.innerWidth;savePrefs();applyPanel();}

let panelDrag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.dr-resize');if(!h||e.button!==0||!panelWide())return;
  e.preventDefault();
  const wasFocus=ui.panelFocus;ui.panelFocus=false;
  panelDrag={px:null,raf:0,wasFocus:wasFocus};
  try{h.setPointerCapture(e.pointerId);}catch(err){}
  document.body.classList.add('dr-resizing');
});
document.addEventListener('pointermove',e=>{
  if(!panelDrag)return;
  const px=panelClamp(window.innerWidth-e.clientX);panelDrag.px=px;
  if(!panelDrag.raf)panelDrag.raf=requestAnimationFrame(()=>{if(panelDrag){panelDrag.raf=0;document.documentElement.style.setProperty('--drw',panelDrag.px+'px');}});
});
function endPanelDrag(){
  if(!panelDrag)return;
  const d=panelDrag;panelDrag=null;if(d.raf)cancelAnimationFrame(d.raf);
  document.body.classList.remove('dr-resizing');
  if(d.px!=null)setPanel(d.px);else ui.panelFocus=d.wasFocus;
  applyPanel();
  if(ui.edit.id&&d.px!=null&&d.wasFocus)renderEditor();
  autoSizeAll($('.drawer'));
}
document.addEventListener('pointerup',endPanelDrag);

function importDo(mode,confirmed){

    const msg=mode==='replace'?'This replaces everything in <b>'+esc(coName())+'</b> with the backup. Its name and description stay. Other clients are not touched.'
      :'This replaces all '+ROOT.clients.length+(ROOT.clients.length===1?' client':' clients')+' in this browser with the clients in the backup.';
    askConfirm(msg+' This cannot be undone.',mode==='replace'?'Replace content':'Replace everything',()=>{ui.importData=d;importDo(mode,true);});
    return;
  }
  let newRoot=null, added=null, data=null;
  try{
    if(mode==='restore'||mode==='replaceAll')newRoot=d.kind==='all'?fixRoot(d.o):d.kind==='client'?(c=>({v:3,activeClientId:c.id,theme:ROOT.theme,clients:[c]}))(clientFromFile(d.o.client)):rootFromFlat(d.o,ROOT.theme);
    else if(mode==='add'){
      added=d.kind==='all'?fixRoot(d.o).clients:[d.kind==='client'?clientFromFile(d.o.client):rootFromFlat(d.o).clients[0]];
      const taken=ROOT.clients.map(c=>c.name.toLowerCase());
      added.forEach(c=>{c.id=newCid();stampClient(c.data,c.id);if(d.kind!=='all')c.archived=false;if(taken.includes(c.name.toLowerCase()))c.name+=' (imported)';taken.push(c.name.toLowerCase());});
    }else if(mode==='replace')data=d.kind==='client'?fixState(d.o.client.data):fixState(d.o,{legacy:true});
    else return;
  }catch(err){console.error(err);closeModal();ui.importData=null;toast('That backup could not be read. Nothing was changed.');return;}
  ui.importData=null;
  discardIfEmpty(null);save(true);
  let msg;
  if(newRoot){ROOT=newRoot;loadFailed=false;msg='Backup restored';}
  else if(added){ROOT.clients=ROOT.clients.concat(added);const f=added.find(c=>!c.archived);if(f)ROOT.activeClientId=f.id;msg=added.length===1?'Added '+added[0].name:added.length+' clients added';}
  else{const c=activeClient();c.data=stampClient(data,c.id);msg=c.name+' restored from the backup';}
  S=activeClient().data;
  resetClientUi();save(true);applyTheme();render();toast(msg);
}

  aiCopy:()=>{if(!ui.ai)return;if(!nonEmpty(ui.ai.summary)){toast('Paste the meeting summary first');const f=$('#ai-summary');f&&f.focus();return;}copyText(aiPackPrompt(),'Prompt copied. Paste it into Claude or any AI chat.');},
  aiCheck:()=>{if(!ui.ai)return;ui.ai.result=parsePackText(ui.ai.answer,'ai');render();const b=$('#ai-result');if(b&&b.scrollIntoView)b.scrollIntoView({block:'start'});},
  aiApply:()=>{const r=ui.ai&&ui.ai.result;if(r&&r.pack)packConfirm(r.pack,r.warnings);},
  aiCreate:()=>{
    const a=ui.ai, r=a&&a.result;if(!r||!r.pack)return;
    const isNew=a.mode==='new', name=String(isNew?a.name:a.newName).trim();
    if(!name){toast('Give the new client a name');const f=$(isNew?'#ai-name':'#ai-newName');f&&f.focus();return;}
    const about=isNew?String(a.about||'').trim():'';ui.ai=null;ui.view='dashboard';createClientWithPack(name,about,r.pack);
  },
  confirmYes:()=>{const cb=ui.confirmCb;ui.confirmCb=null;closeModal();cb&&cb();},
  modalClose:()=>closeModal()
};

/* ================= events ================= */
document.addEventListener('click',e=>{
  if($('#addmenu').classList.contains('open')&&!e.target.closest('#addwrap'))closeMenu();
  if(!e.target.closest('.cwrap'))closeClientMenus();
  if(e.target.closest('[data-stop]'))return;
  const sm=e.target.closest('summary[data-adv]');if(sm){ui.advOpen[sm.dataset.adv]=!sm.parentElement.open;return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACTS[a.dataset.act]){
    if(a.tagName==='INPUT'&&a.type==='checkbox'){ACTS[a.dataset.act](a,e);return;}
    ACTS[a.dataset.act](a,e);
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.tagName==='TEXTAREA')autoSize(el);
  if(el.id==='q'){ui.q=el.value;if(ui.view!=='library')ui.view='library';render();return;}
  if(el.dataset.snapPick&&ui.snapCtx){
    const c=ui.snapCtx;c.vals=readSnapForm();c[el.dataset.snapPick]=el.value;metricModal(c);return;
  }
  if(el.dataset.plat){
    const h=el.closest('[data-item-id]'),it=h&&getItem(h.dataset.itemId);if(!it)return;
    const p=el.dataset.plat,has=it.platforms.includes(p);
    if(el.checked&&!has)it.platforms.push(p);if(!el.checked&&has)it.platforms=it.platforms.filter(x=>x!==p);
    save();liveCaption(it);return;
  }
  if(el.dataset.ui){
    sp(ui,el.dataset.ui,el.type==='checkbox'?el.checked:el.value);
    if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date')render();
    return;
  }
  if(el.dataset.root==='theme'){ROOT.theme=el.value;applyTheme();save();return;}
  if(el.dataset.pktag!=null){const g=Object.keys(S.pack.hashtagGroups)[+el.dataset.pktag];if(g!=null){S.pack.hashtagGroups[g]=el.value.slice(0,2000);save();}return;}
  if(el.dataset.s){
    const v=el.type==='checkbox'?el.checked:(el.type==='number'?Math.max(0,num(el.value)):el.value);
    sp(S,el.dataset.s,v);
    if(el.dataset.s.indexOf('jobsite.checks')===0)render();
    save();return;
  }
  if(el.dataset.shot){
    // One shot state, wherever it is ticked: the Script tab, Shoot & edit and Need to Film all read the same record
    const h=el.closest('[data-item-id]'),it=h&&getItem(h.dataset.itemId);if(!it)return;
    const f=el.dataset.sf;shotSet(it,el.dataset.shot,f,el.type==='checkbox'?el.checked:el.value);save();
    if(f==='notes'||f==='desc'){if(f==='desc')liveScript(it);return;}
    if(h.classList.contains('fcard'))h.outerHTML=fcard(it);else renderEditor();
    return;
  }
  if(el.dataset.f){
    const h=el.closest('[data-item-id]'),it=h&&getItem(h.dataset.itemId);if(!it)return;
    const path=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;
    if(/^shorts\.\d+\.sectionIdx$/.test(path)){v=v===''?-1:+v;sp(it,path,v);save();renderEditor();return;}
    const old=gp(it,path), oldM=monthOf(it);
    sp(it,path,v);
    if(path==='scriptType'){if(!it.captionStyle||it.captionStyle===CAPTION_FROM_SCRIPT[old])it.captionStyle=CAPTION_FROM_SCRIPT[v]||'Educational';save();renderEditor();return;}
    syncDerived(it,path);
    if(/^blocks\.\d+\.(broll|captured)$/.test(path))liveBlocks(it,el);
    if(path==='script'&&$('.spk .seg')===null&&nonEmpty(v)&&$('#spk-prev')){save();const sc=$('.dr-b').scrollTop;renderEditor();const ta=$('.drawer [data-f="script"]');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}$('.dr-b').scrollTop=sc;return;}
    if(['captionStyle','hashtagGroup','includeHashtags','captionNeeded','ytCover','captionStatus'].includes(path)){if(path==='captionStatus')it.prod.caption=v==='Done';save();renderEditor();return;}
    if(path==='publishDate'&&v){it.plannedMonth=mk(v);const pm=h.querySelector('[data-f="plannedMonth"]');if(pm)pm.value=it.plannedMonth;}
    if(path==='publishDate'||path==='plannedMonth')noteMonthChange(it,oldM);
    if(path==='status'){if(v==='Posted'&&!it.publishedDate)it.publishedDate=today();if(v!=='Idea')it.backlogFrom='';save();renderEditor();return;}
    if(path==='type'){ensureType(it);it.platforms=defaultPlatforms(it.type);save();renderEditor();return;}
    if(path==='winning'){save();renderEditor();return;}
    if(path==='reelKind'&&v==='Recap'&&!it.recap.month)it.recap.month=monthName(monthOf(it)||ui.month);
    if(path.indexOf('perf.')===0&&ui.view==='performance')refreshPerf();
    save();liveScript(it);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('input[data-pack-import]')){
    const f=el.files&&el.files[0], mode=el.dataset.packImport;el.value='';if(!f)return;
    if(f.size>2e6){toast('That file is too big to be a wording pack');return;}
    const r=new FileReader();r.onload=()=>packFileLoaded(String(r.result||''),mode);r.onerror=()=>toast('That file could not be read');r.readAsText(f);
    return;
  }
  if(el.matches&&el.matches('input[data-import]')){
    const f=el.files&&el.files[0];if(!f)return;
    const r=new FileReader();
    // Nothing changes until a choice is made in the import dialog
    r.onload=()=>{let o=null;try{o=JSON.parse(r.result);}catch(err){}
      const kind=importKind(o);if(!kind){toast(o&&o.format===PACK_FORMAT?'That is a wording pack. Use Import pack file under Client wording.':'That file is not a Content HQ backup');return;}
      ui.importData={kind:kind,o:o};importModal();};
    r.readAsText(f);el.value='';
  }
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('[data-form]');
  if(form&&form.dataset.form==='addTask'){
    e.preventDefault();
    const t=$('#tq-title').value.trim();if(!t){$('#tq-title').focus();return;}
    ui.tqCat=$('#tq-cat').value;
    S.tasks.push(normTask({title:t,dueDate:today(),category:ui.tqCat,createdAt:Date.now()}));
    save();ui.focus='#tq-title';render();toast('Task added');return;
  }
  if(form&&form.dataset.form==='saveTask'){
    e.preventDefault();
    const t=$('#tk-title').value.trim(),d=$('#tk-date').value;if(!t){toast('Give the task a name');$('#tk-title').focus();return;}if(!d){toast('Pick a due date');return;}
    const o={title:t,dueDate:d,category:$('#tk-cat').value,contentId:$('#tk-vid').value,notes:$('#tk-notes').value};
    const ex=ui.taskEdit&&S.tasks.find(x=>x.id===ui.taskEdit);
    if(ex){const done=$('#tk-done');Object.assign(ex,o);if(done&&done.checked!==ex.completed){ex.completed=done.checked;ex.completedAt=done.checked?Date.now():null;}}
    else S.tasks.push(normTask(Object.assign(o,{createdAt:Date.now()})));
    ui.taskEdit=null;save();closeModal();const q=$('#tq-title');if(q)q.value='';render();toast(ex?'Task saved':'Task added');return;
  }
  if(form&&form.dataset.form==='saveSnap'){e.preventDefault();saveSnap();return;}
  if(form&&form.dataset.form==='saveClient'){e.preventDefault();saveClientForm(form);return;}
  const f=e.target.closest('[data-form="addIdea"]');if(!f)return;
  e.preventDefault();
  const t=$('#qa-title').value.trim();if(!t){toast('Type the idea first');$('#qa-title').focus();return;}
  const fm=$('#qa-format').value,topic=$('#qa-topic').value;
  S.items.push(newItem(fm==='Long Form'?'Long Form':'Reel',{title:t,status:'Idea',pillar:$('#qa-pillar').value,ideaFormat:fm,topic:topic,group:groupFor(topic),priority:$('#qa-prio').value,reelKind:fm==='Long Form'?'':'Standalone'}));
  save();ui.focus='#qa-title';render();toast('Idea added');
});
document.addEventListener('keydown',e=>{
  const kt=e.target;
  if(kt&&kt.dataset&&(kt.dataset.tp!=null||kt.dataset.tpb!=null)&&(e.key==='Enter'||e.key==='Backspace')){tpKey(e,kt);return;}
  if(kt&&kt.classList&&kt.classList.contains('dr-resize')){
    const cur=panelWidth(),step=e.shiftKey?120:40;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setPanel(cur+(e.key==='ArrowLeft'?step:-step));autoSizeAll($('.drawer'));return;}
    if(e.key==='Home'){e.preventDefault();resetPanel();const h=$('.drawer .dr-resize');h&&h.focus();return;}
  }
  if(e.key==='Escape'){
    if($('#modal-wrap .modal'))closeModal();
    else if($('#addmenu').classList.contains('open'))closeMenu();
    else if($('.cmenu.open')){const b=$('.cmenu.open').parentElement.querySelector('[data-act="clientMenu"]');closeClientMenus();b&&b.focus();}
    else if(ui.edit.id)closeEditor();
  }
});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)autoSizeAll(e.target);},true);
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{applyPanel();autoSizeAll();},150);});
/* drag and drop for the pipeline */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kcard');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
document.addEventListener('dragend',()=>{$$('.kcard.dragging').forEach(c=>c.classList.remove('dragging'));$$('.kcol.over').forEach(c=>c.classList.remove('over'));});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.kcol');if(c){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.kcol');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over');});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('.kcol');if(!c)return;e.preventDefault();
  const id=e.dataTransfer.getData('text/plain'),it=getItem(id);if(!it)return;
  const s=c.dataset.status;if(it.status!==s){setStatus(it,s);save();render();toast('Moved to '+s);}else render();
});

/* ================= render + init ================= */
/* Theme is shared by every client. The page title and switcher follow the active client. */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',ROOT.theme||'auto');
  document.title='Content HQ · '+coName();
  renderClientUi();
}
function updateStoreNote(){const n=$('#storeNote');if(n)n.textContent=loadFailed?'Your saved content could not be loaded. It has not been changed, and saving is paused.':memOnly?'Saving is off in this browser. Export a backup before you leave.':'Saved in this browser.';n&&n.classList.toggle('warn',memOnly||loadFailed);}
function render(){
  const kb=$('.kanban'),sl=kb?kb.scrollLeft:0;
  renderClientUi();
  $('#nav').innerHTML=navHtml();
  $('#main').innerHTML=VIEWS[ui.view]();
  const kb2=$('.kanban');if(kb2)kb2.scrollLeft=sl;
  autoSizeAll($('#main'));
  if(ui.focus){const f=$(ui.focus);if(f)f.focus();ui.focus=null;}
  const q=$('#q');if(q&&q.value!==ui.q)q.value=ui.q;
}
function init(){
  memOnly=!storageOk();
  ROOT=load()||seedRoot();
  S=activeClient().data;
  save(true);
  applyTheme();
  loadPrefs();applyPanel();
  ui.month=focusMonthDefault();ui.calMonth=ui.month;ui.pipeMonth=ui.month;ui.planMonth=addMonths(mk(today()),1);
  render();updateStoreNote();
  if(loadFailed)showModal('<div class="modal-h"><h3>Your saved content could not be loaded</h3></div><div class="modal-b"><p>Nothing was deleted or overwritten. Your saved content is still in this browser, untouched.</p><p>You are looking at the starter content. Changes you make right now will <b>not</b> be saved.</p><p>To get your work back, go to Settings and use Import backup with your latest backup file. Avoid exporting a backup right now, because it would only contain the starter content.</p><div class="row-gap"><button class="btn primary" data-act="modalClose">OK</button></div></div>');
}
init();
/* Home is built around today's date. If the page stays open past midnight, catch up when it comes back into view. */
let shownDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&today()!==shownDay){shownDay=today();if(!$('#modal-wrap .modal'))render();}});
window.__hq={get S(){return S;},get ROOT(){return ROOT;},switchClient:switchClient,ui:ui,render:render,ACTS:ACTS,VIEWS:VIEWS,openEditor:openEditor};
})();
